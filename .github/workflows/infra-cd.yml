name: infra-cd

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-cd.yml"]
  workflow_dispatch:        # déclenchement manuel possible
    inputs:
      environment:
        description: "Environnement à provisionner"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Valider le Bicep (what-if)
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          az deployment group what-if \
            --resource-group "rg-progress-careers-$ENV" \
            --template-file infra/bicep/appservice.bicep \
            --parameters environmentName=$ENV \
                         keyVaultUri="${{ secrets.KEYVAULT_URI }}"
      - name: Déployer l'infrastructure
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          az deployment group create \
            --resource-group "rg-progress-careers-$ENV" \
            --template-file infra/bicep/appservice.bicep \
            --parameters environmentName=$ENV \
                         keyVaultUri="${{ secrets.KEYVAULT_URI }}"
