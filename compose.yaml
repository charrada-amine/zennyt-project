name: zennyt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zennyt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /workspace/backend
    command:
      - mvn
      - -B
      # Development startup only; CI must still compile and run the tests.
      - -Dmaven.test.skip=true
      - spring-boot:run
      - -Dspring-boot.run.profiles=dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zennyt}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      PASSWORD_RESET_CODE_TTL: ${PASSWORD_RESET_CODE_TTL:-PT10M}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EMBEDDING_HF_API_KEY: ${EMBEDDING_HF_API_KEY:-}
      EMBEDDING_HF_MODEL: ${EMBEDDING_HF_MODEL:-}
      RECRUITMENT_CALLBACK_SECRET: ${RECRUITMENT_CALLBACK_SECRET:-}
      # Garde-fou anti « abonnements gratuits en prod » : le vérificateur provisoire
      # (stub) n'existe qu'en dev — la prod doit fournir un vrai vérificateur.
      BILLING_RECEIPT_VERIFIER: ${BILLING_RECEIPT_VERIFIER:-stub}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend
      - ./contracts:/workspace/contracts:ro
      - maven-cache:/root/.m2
      - backend-target:/workspace/backend/target
      - games-assets:/tmp/zennyt-games-assets
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  admin:
    build:
      context: ./admin
      args:
        APP: web
        PORT: "3001"
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    depends_on:
      - backend
    init: true

  console:
    build:
      context: ./admin
      args:
        APP: console
        PORT: "3002"
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3002}:3002"
    depends_on:
      - backend
    init: true

volumes:
  postgres-data:
  maven-cache:
  backend-target:
  games-assets:
