name: zennyt
description: "Zennyt Careers — career discovery mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flame: ^1.18.0
  cached_network_image: ^3.4.1
  pinput: ^6.0.2
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  device_preview: ^1.3.1
  image_picker: ^1.2.2
  file_selector: ^1.1.0
  flutter_dotenv: ^6.0.1
  flutter_native_ocr: ^0.1.0
  flutter_svg: ^2.0.10
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  http_parser: ^4.1.2
  syncfusion_flutter_pdf: ^34.1.30
  pdfrx: ^2.4.7
  flutter_animate: ^4.5.2

  # Merged dependencies
  freezed_annotation: ^3.0.0
  equatable: ^2.0.5
  get_it: ^9.2.1
  dartz: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.3
  stomp_dart_client: ^3.0.1
  agora_rtc_engine: ^6.6.3
  photo_manager: ^3.9.0
  file_picker: ^12.0.0-beta.7
  flutter_slidable: ^4.0.3
  lottie: ^3.5.1
  internet_connection_checker_plus: ^2.5.1
  connectivity_plus: ^6.1.3
  fluttertoast: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  build_runner: ^2.4.11
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.3

dependency_overrides:
  ffi: ^2.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#001D55"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/04 Predictive Puzzle/
    - assets/J’investigue/memoryobject/
    - assets/J’investigue/MemoryObject/svg/
    - assets/games icons/
    - assets/connectivity/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 700
