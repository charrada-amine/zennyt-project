openapi: 3.0.3
info:
  title: Zennyt — Composants partagés
  description: >
    Schémas, réponses et schéma de sécurité communs à tous les bounded contexts.
    Référencés par les autres contrats via $ref distant, ex :
    `$ref: './common.openapi.yaml#/components/schemas/Error'`.
  version: 1.0.0

# Ce fichier ne définit pas de paths : il sert uniquement de bibliothèque de composants.
paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton d'accès JWT (RS256) émis par le contexte Identity.
        À placer dans l'en-tête : `Authorization: Bearer <accessToken>`.

  parameters:
    PageParam:
      name: page
      in: query
      description: Numéro de page (0-indexé)
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      description: Taille de page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Error:
      type: object
      description: >
        Format d'erreur unifié : `error` est un code machine-readable —
        spécifique à la règle métier en cause quand il y en a un
        (`JOB_NOT_ACTIVE`, `ASSESSMENT_IN_USE`, `NO_ASSESSMENT_LINKED`,
        `SWIPE_ALREADY_EXISTS`, `ALREADY_MATCHED`, `ATTEMPT_ALREADY_CONSUMED`,
        `ATTEMPT_ALREADY_SUBMITTED`, `VALIDATION_ERROR`...), sinon un code
        générique dérivé du statut HTTP (`BAD_REQUEST`, `UNAUTHORIZED`,
        `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`...). Des champs de contexte
        additionnels apparaissent au même niveau selon le cas — ex.
        `fieldErrors` (validation), `linkedJobOfferIds` (suppression
        d'évaluation bloquée).
      required: [error, message]
      properties:
        error: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "Le champ email est invalide." }
        fieldErrors:
          type: array
          description: Détail des erreurs de validation par champ (VALIDATION_ERROR uniquement).
          items:
            type: object
            properties:
              field: { type: string, example: "email" }
              message: { type: string, example: "doit être une adresse valide" }

    PageMeta:
      type: object
      description: Métadonnées de pagination renvoyées avec les listes.
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        first: { type: boolean }
        last: { type: boolean }

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentification requise ou jeton invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Droits insuffisants pour cette ressource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflit avec l'état actuel de la ressource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
