openapi: 3.0.3
info:
  title: Zennyt — Games API
  description: >
    Bounded context Games : jeux sérieux d'évaluation cognitive (Planifik,
    Move Fast, Memory Quest, Choix&Cap). Le client démarre une session, joue
    les mini-jeux et remonte des MÉTRIQUES objectives ; le score déterministe
    est calculé côté serveur. Ce contexte est indépendant : il n'expose et ne
    consomme aucun autre contexte, et publie son résultat via l'événement
    games.result.recorded.
  version: 1.0.0

servers:
  - url: https://api.zennyt.com/api/v1
    description: Production
  - url: https://api-staging.zennyt.com/api/v1
    description: Staging

tags:
  - name: Games
    description: Sessions de jeux sérieux et scoring

security:
  - bearerAuth: []

paths:
  /games/sessions:
    post:
      tags: [Games]
      summary: Démarrer une session de jeu pour le joueur connecté
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSessionRequest' }
      responses:
        '201':
          description: Session créée (statut IN_PROGRESS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /games/sessions/{sessionId}/results:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games]
      summary: Soumettre les métriques d'un mini-jeu terminé
      description: >
        Le client n'envoie jamais de score, seulement des métriques mesurées.
        Le serveur calcule le score du mini-jeu ; au dernier mini-jeu du type,
        la session passe COMPLETED et l'événement games.result.recorded est émis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitResultRequest' }
      responses:
        '200':
          description: Résultat enregistré, session mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { $ref: './common.openapi.yaml#/components/securitySchemes/bearerAuth' }

  schemas:
    GameType:
      type: string
      description: Type de jeu sérieux.
      enum: [PLANIFIK, MOVE_FAST, MEMORY_QUEST, DECISION]

    MiniGame:
      type: string
      description: >
        Mini-jeu évalué dans une session. DECISION_CORE (« Je Décide ») est déclaré
        mais non jouable tant que le catalogue de scénarios est vide (même patron
        que TASK_SCHEDULING avant implémentation).
      enum: [OPTIMAL_PATH, TASK_SCHEDULING, PREVISION_PUZZLE, MOVE_FAST_CORE, MEMORY_QUEST_CORE, DECISION_CORE]

    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]

    StartSessionRequest:
      type: object
      required: [gameType]
      properties:
        gameType: { $ref: '#/components/schemas/GameType' }

    CostlyZonesAvoided:
      type: string
      description: >
        Degré d'évitement des zones coûteuses sur un niveau. Barème serveur :
        TOTAL=2, PARTIAL=1, NONE=0 (raffinement à valider par le psychologue).
      enum: [TOTAL, PARTIAL, NONE]

    SecondaryObjectivesReached:
      type: string
      description: >
        Atteinte des objectifs secondaires d'un niveau. Barème serveur : YES=1,
        NO=0, PARTIAL=règle à valider (0 par défaut).
      enum: [YES, PARTIAL, NO]

    OptimalPathLevelMetrics:
      type: object
      description: Métriques objectives d'UN niveau de « Chemin Optimal ».
      required: [attempts, pathLength, optimalLength, costlyZonesAvoided, secondaryObjectivesReached]
      properties:
        levelIndex: { type: integer, minimum: 0, description: "Index du niveau (0-based)" }
        attempts: { type: integer, minimum: 1, description: "Essais avant validation du niveau" }
        pathLength: { type: integer, minimum: 0, description: "Longueur du chemin tracé" }
        optimalLength: { type: integer, minimum: 1, description: "Longueur du chemin optimal" }
        costlyZonesAvoided: { $ref: '#/components/schemas/CostlyZonesAvoided' }
        secondaryObjectivesReached: { $ref: '#/components/schemas/SecondaryObjectivesReached' }

    OptimalPathMetrics:
      type: object
      description: >
        Métriques objectives du mini-jeu « Chemin Optimal ». Le mini-jeu enchaîne
        plusieurs niveaux : envoyer `levels` (une entrée par niveau) — le serveur
        note chaque niveau /10 puis agrège par moyenne arrondie (un seul Attempt).
        Les champs plats restent acceptés en mode mono-niveau (compatibilité).
      properties:
        levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OptimalPathLevelMetrics' }
          description: "Métriques par niveau (mode multi-niveaux, recommandé)."
        attempts: { type: integer, minimum: 1, description: "Mono-niveau : essais avant validation" }
        pathLength: { type: integer, minimum: 0, description: "Mono-niveau : longueur du chemin tracé" }
        optimalLength: { type: integer, minimum: 1, description: "Mono-niveau : longueur du chemin optimal" }
        costlyZonesAvoided: { type: boolean, description: "Mono-niveau : évitement total (true) / aucun (false)" }
        secondaryObjectives: { type: integer, minimum: 0, description: "Mono-niveau : nb d'objectifs secondaires atteints" }

    CalibrationMethod:
      type: string
      description: >
        Méthode de calibrage appareil. « technique » = mesure machine pure
        (latence affichage + traitement d'entrée). « hardware_profile_fallback »
        = profil matériel seul quand la mesure directe est indisponible (fiabilité réduite).
      enum: [technique, hardware_profile_fallback]

    InputMode:
      type: string
      enum: [keyboard, touch, mouse, swipe]

    DeviceCategory:
      type: string
      enum: [mobile, tablet, desktop]

    DeviceCalibration:
      type: object
      description: >
        Socle de calibrage APPAREIL (méthode « technique » pure — sépare la latence
        matérielle du temps de réaction cognitif). Optionnel. Les temps bruts restent
        stockés tels quels ; la correction (calibrationOffsetMs) s'applique au calcul
        des indicateurs temporels. Les essais d'échauffement ne servent JAMAIS au calibrage.
      required: [calibrationMethod, inputMode, deviceCategory, refreshRateHz]
      properties:
        calibrationMethod: { $ref: '#/components/schemas/CalibrationMethod' }
        inputMode: { $ref: '#/components/schemas/InputMode' }
        deviceCategory: { $ref: '#/components/schemas/DeviceCategory' }
        refreshRateHz:
          type: number
          format: double
          description: "Détecté via requestAnimationFrame / équivalent Flutter."
        hardwareConcurrency:
          type: integer
          nullable: true
          description: "Détection passive (nullable)."
        deviceMemoryGb:
          type: number
          format: double
          nullable: true
          description: "Détection passive (nullable — absent iOS)."
        inputProcessingLatencyMs:
          type: number
          format: double
          nullable: true
          description: >
            Médiane du traitement d'entrée (Event-Timing-équivalent) sur TOUTE la
            session — mesure machine pure. Absent en fallback.
        displayLatencyMs:
          type: number
          format: double
          readOnly: true
          description: "Calculé serveur = (1000 / refreshRateHz) / 2 (théorique)."
        calibrationOffsetMs:
          type: number
          format: double
          readOnly: true
          description: "Calculé serveur = displayLatencyMs + inputProcessingLatencyMs."

    MoveFastRule:
      type: string
      description: Règle active sur un essai (flexibilité cognitive).
      enum: [ORIENTATION, MOVEMENT]

    MoveFastResponseItem:
      type: object
      description: >
        Un essai « Je bouge » mesuré (essais d'échauffement compris, marqués
        practiceTrial). Le client n'envoie que des mesures — jamais de points ni
        d'indicateurs dérivés.
      required: [correct, reactionTimeMs, ruleActive]
      properties:
        practiceTrial:
          type: boolean
          default: false
          description: "true si essai d'échauffement (exclu du scoring et des stats par le serveur)."
        correct:
          type: boolean
          description: "true si la réponse était correcte."
        reactionTimeMs:
          type: integer
          minimum: 0
          description: "Temps de réaction mesuré, en millisecondes."
        ruleActive: { $ref: '#/components/schemas/MoveFastRule' }
        isSwitchTrial:
          type: boolean
          default: false
          description: "true si la règle a changé par rapport à l'essai précédent."
        appliedOldRule:
          type: boolean
          default: false
          description: "true si l'erreur correspond à l'application de l'ancienne règle (erreur persévérative)."

    MoveFastMetrics:
      type: object
      description: >
        Métriques objectives du jeu « Je bouge / Move Fast ». Le serveur exclut
        les essais d'échauffement, rejoue la séquence correct/incorrect pour
        appliquer le barème en escalade, puis dérive les indicateurs de
        flexibilité cognitive (MoveFastIndicators, dans la réponse).
      required: [practiceTrialExcludedCount, responses]
      properties:
        practiceTrialExcludedCount:
          type: integer
          minimum: 0
          description: >
            Nombre d'essais d'échauffement exclus. Doit être cohérent avec le
            nombre d'entrées responses ayant practiceTrial=true.
        responses:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MoveFastResponseItem' }
          description: "Essais mesurés dans l'ordre de jeu (échauffement inclus)."

    PrevisionPuzzleLevelMetrics:
      type: object
      description: >
        Métriques objectives d'UN niveau de « Predictive Puzzle » (Tour de Hanoï).
        Le serveur applique le barème catégoriel de la fiche puis agrège.
      required: [discCount, firstTrySuccess, sequenceErrors, plannedMoves, retries, completed]
      properties:
        levelIndex: { type: integer, minimum: 0, description: "Index du niveau (0-based)" }
        discCount: { type: integer, minimum: 1, description: "Nombre de disques (optimal = 2^n − 1)" }
        firstTrySuccess:
          type: boolean
          description: "true si le niveau est réussi au 1er run sans retry ni erreur."
        sequenceErrors:
          type: integer
          minimum: 0
          description: "Nombre d'erreurs de séquence sur le niveau."
        plannedMoves:
          type: integer
          minimum: 0
          description: "Nombre de coups planifiés (run final du niveau)."
        optimalMoves:
          type: integer
          minimum: 1
          description: "Optionnel : optimal déterministe 2^discCount − 1 (recalculé serveur si absent)."
        retries:
          type: integer
          minimum: 0
          description: "Nombre de réinitialisations de plan sur le niveau."
        completed:
          type: boolean
          description: "true si la cible du niveau a été atteinte."

    PrevisionPuzzleMetrics:
      type: object
      description: >
        Métriques objectives de « Predictive Puzzle ». Le mini-jeu enchaîne
        plusieurs niveaux (Tour de Hanoï 3/4/5 disques) : envoyer `levels` (une
        entrée par niveau joué). Le serveur note chaque niveau /10 (barème
        catégoriel de la fiche) puis agrège par moyenne arrondie (un seul Attempt).
      required: [levels]
      properties:
        levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PrevisionPuzzleLevelMetrics' }
          description: "Métriques par niveau joué."

    MoveFastSessionEndCondition:
      type: object
      description: >
        Condition de fin de session Move Fast (documentation ; pilotée côté serveur
        par MoveFastConfig.SESSION_END_MODE, non transmise par le client).
        ⚠️ DIVERGENCE ASSUMÉE : le mode par défaut FIXED_BUDGET (12/18/84 s) diverge
        de la fiche, qui prescrit REACH_MAX_MULTIPLIER (aucune limite). Basculer =
        changer une constante (backend + miroir mobile), en attente du psychologue.
      properties:
        mode:
          type: string
          enum: [FIXED_BUDGET, REACH_MAX_MULTIPLIER]
          default: FIXED_BUDGET
          description: "Mode de fin de session. FIXED_BUDGET = comportement produit ; REACH_MAX_MULTIPLIER = fiche."
        targetCorrectAnswers: { type: integer, example: 12, description: "Mode FIXED_BUDGET uniquement." }
        maxResponses: { type: integer, example: 18, description: "Mode FIXED_BUDGET uniquement (pas de plafond en REACH_MAX_MULTIPLIER)." }
        sessionSeconds: { type: integer, example: 84, description: "Mode FIXED_BUDGET uniquement." }

    MoveFastIndicators:
      type: object
      description: >
        Indicateurs de flexibilité cognitive « Je bouge », CALCULÉS PAR LE SERVEUR
        à partir des essais notés (échauffement exclu). Le client ne les calcule
        jamais. Métrique centrale : switchCostMs (coût de bascule).
      properties:
        precisionRatio: { type: number, format: double, description: "correct / total × 100 (hors pratique)" }
        averageReactionTimeMs: { type: number, format: double }
        medianReactionTimeMs: { type: number, format: double }
        stdDevReactionTimeMs: { type: number, format: double }
        fastResponsesPercent: { type: number, format: double, description: "% réponses < 250 ms" }
        slowResponsesPercent: { type: number, format: double, description: "% réponses > 2000 ms" }
        switchResponseTimeAvgMs: { type: number, format: double, description: "moyenne des essais isSwitchTrial=true" }
        nonSwitchResponseTimeAvgMs: { type: number, format: double, description: "moyenne des essais isSwitchTrial=false" }
        switchCostMs: { type: number, format: double, description: "switch − nonSwitch" }
        perseverativeErrorsCount: { type: integer, description: "erreurs avec appliedOldRule=true" }
        correctResponsesRuleOrientation: { type: integer }
        correctResponsesRuleMovement: { type: integer }
        sessionDurationSec: { type: integer }
        sessionCompletionStatus: { type: string, enum: [completed, abandoned] }
        calibrationApplied: { type: boolean, description: "true si un DeviceCalibration a été fourni." }
        calibrationReliable: { type: boolean, description: "false si fallback profil matériel (fiabilité réduite)." }
        calibrationOffsetMs: { type: number, format: double, description: "Offset appliqué aux temps bruts." }
        averageReactionTimeAdjustedMs: { type: number, format: double, description: "Moyenne RT corrigée (brut − offset)." }
        medianReactionTimeAdjustedMs: { type: number, format: double }
        fastResponsesPercentAdjusted: { type: number, format: double }
        slowResponsesPercentAdjusted: { type: number, format: double }
        switchCostAdjustedMs: { type: number, format: double, description: "Coût de bascule corrigé (l'offset s'annule dans la différence)." }

    PrevisionPuzzleIndicators:
      type: object
      description: >
        Indicateurs qualitatifs « Predictive Puzzle », CALCULÉS PAR LE SERVEUR.
        `globalPlanSuccess` (succès/échec du plan) reste HORS du score /10.
      properties:
        globalPlanSuccess: { type: boolean, description: "true si tous les niveaux joués sont complétés." }
        levelsPlayed: { type: integer }
        levelsCompleted: { type: integer }
        levels:
          type: array
          items:
            type: object
            properties:
              levelIndex: { type: integer }
              discCount: { type: integer }
              score: { type: integer, description: "Score /10 du niveau" }
              completed: { type: boolean }
              firstTrySuccess: { type: boolean }

    ScoreBreakdownLine:
      type: object
      description: >
        Une ligne du DÉTAIL du score (panneau « d'où viennent mes points »),
        calculée serveur à partir des mêmes métriques et du même barème. `kind`
        pilote l'affichage : NOTE (explication), INFO (mesure sans points),
        CRITERION (« label (detail) : points/max »), SUBTOTAL (niveau),
        TOTAL (total/moyenne).
      required: [kind, label]
      properties:
        kind: { type: string, enum: [NOTE, INFO, CRITERION, SUBTOTAL, TOTAL] }
        label: { type: string }
        detail: { type: string, nullable: true, description: "Valeur mesurée / formule (entre parenthèses à l'affichage)." }
        points: { type: integer, nullable: true }
        maxPoints: { type: integer, nullable: true }

    MemoryTaskKind:
      type: string
      description: Type de tâche notée « J'investigue ».
      enum: [SAME_ORDER, REVERSE_ORDER, RESTORE, AFTER_DISTRACTION]

    MemoryTaskResult:
      type: object
      description: >
        Résultat mesuré d'UNE tâche (une instance de niveau). Le serveur note la
        justesse du rappel (correct/total) et applique le timeout ajusté du
        calibrage : une tâche dont responseTimeMs dépasse (max_task_time_ms +
        offset) est un échec par dépassement (note voidée). Le client n'envoie
        jamais de points.
      required: [kind, correct, total, responseTimeMs]
      properties:
        kind: { $ref: '#/components/schemas/MemoryTaskKind' }
        correct: { type: integer, minimum: 0, description: "Éléments rappelés correctement" }
        total: { type: integer, minimum: 0, description: "Éléments à rappeler" }
        responseTimeMs: { type: integer, minimum: 0, description: "Temps brut de la tâche (timeout appliqué serveur)" }

    MemoryQuestMetrics:
      type: object
      description: >
        Mesures brutes de « J'investigue » (mémoire de travail). Le serveur note
        chaque tâche 0–5 (rappel même ordre/inverse, restauration d'objets, rappel
        après distraction) puis calcule le composite /100 (indicatif). La Mission B
        est jouée si objectCount > 0 ; la distraction si distractionPlayed.
        Le score dépend du TEMPS via le timeout par tâche (calibrage appareil) :
        envoyer `tasks` (par instance) permet l'ajustement. Sans `tasks`, le
        composite est calculé sur les agrégats plats (compatibilité, sans timeout).
      required: [observedDigits, correctSameDigits, correctReverseDigits, highestSequenceLength]
      properties:
        observedDigits: { type: integer, minimum: 1, description: "Chiffres observés (Mission A)" }
        correctSameDigits: { type: integer, minimum: 0, description: "Chiffres corrects, rappel même ordre" }
        correctReverseDigits: { type: integer, minimum: 0, description: "Chiffres corrects, rappel inverse" }
        highestSequenceLength: { type: integer, minimum: 0, description: "Empan maximal atteint" }
        objectCount: { type: integer, minimum: 0, description: "Nb d'objets (Mission B ; 0 si non jouée)" }
        restoreCorrect: { type: integer, minimum: 0, description: "Positions correctes à la restauration" }
        manipulationCount: { type: integer, minimum: 0, description: "Manipulations automatiques observées" }
        distractionPlayed: { type: boolean, description: "true si la phase de distraction a été jouée" }
        afterDistractionObserved: { type: integer, minimum: 0, description: "Chiffres à protéger (distraction)" }
        afterDistractionCorrect: { type: integer, minimum: 0, description: "Chiffres corrects après distraction" }
        distractionQuestionCorrect: { type: boolean, description: "Réponse à la question rapide correcte (indicateur)" }
        finalLevel: { type: integer, minimum: 1, default: 1, description: "Niveau atteint (1–7)" }
        sessionCompleted: { type: boolean, default: true, description: "false = abandon avant la condition de fin" }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/MemoryTaskResult' }
          description: "Tâches par instance (avec timing) — active l'ajustement timeout du calibrage."

    MemoryQuestIndicators:
      type: object
      description: >
        Indicateurs « J'investigue » CALCULÉS PAR LE SERVEUR : notes par tâche
        (0–5) + composite /100 (indicatif, non diagnostique) + niveau atteint et
        validité de session. Tâches optionnelles nulles si non jouées.
      properties:
        compositeScore: { type: integer, description: "Composite /100" }
        sameOrderScore: { type: integer }
        reverseOrderScore: { type: integer }
        restoreScore: { type: integer, nullable: true }
        afterDistractionScore: { type: integer, nullable: true }
        highestSequenceLength: { type: integer }
        distractionQuestionCorrect: { type: boolean }
        missionBPlayed: { type: boolean }
        distractionPlayed: { type: boolean }
        finalLevel: { type: integer, description: "Niveau atteint (1–7)" }
        sessionValid: { type: boolean, description: "false si appareil peu fiable / abandon / trop de timeouts" }
        timeoutTaskCount: { type: integer, description: "Tâches en échec par dépassement de temps (timeout ajusté)" }

    DecisionDimension:
      type: string
      description: >
        Dimension cognitive de « Je Décide » (fiche « JE DÉCIDE ») : 5 capacités,
        6 items chacune, /18 par dimension. DT est la seule dont le score dépend du temps.
      enum: [II, ER, DT, CS, RE]

    AdministrationMode:
      type: string
      description: >
        Mode de passation. En UNSUPERVISED, les contrôles de plausibilité des temps
        sont renforcés (couche provisoire).
      enum: [SUPERVISED, UNSUPERVISED]

    DecisionItemResponse:
      type: object
      description: >
        Réponse mesurée à UN item « Je Décide ». Le client envoie l'option choisie
        et le temps — jamais de qualité ni de points : la QUALITÉ de l'option (donc
        les points /3) est décidée serveur via le catalogue de scénarios.
      required: [itemId, dimension, responseTimeMs]
      properties:
        itemId: { type: string, description: "Clé de l'item dans le catalogue serveur." }
        dimension: { $ref: '#/components/schemas/DecisionDimension' }
        selectedOptionId: { type: string, nullable: true, description: "Option choisie (absent si non répondu)." }
        responseTimeMs: { type: integer, minimum: 0, description: "Temps de réponse brut (ms)." }
        answered: { type: boolean, default: true, description: "false → item manquant (imputation par dimension)." }
        decisionChangesCount: { type: integer, minimum: 0, default: 0, description: "Changements d'avis avant validation (indicateur)." }

    DecisionMetrics:
      type: object
      description: >
        Mesures brutes de « Je Décide » (prise de décision). Le serveur note chaque
        item /3 via le catalogue (qualité de l'option), agrège /18 → /90, puis
        standardise en SCW /100 (poids provisoires). La règle DT (temps) et le
        calibrage appareil affectent la note des items DT. Le client n'envoie jamais
        de points. ⚠️ Les échelles post-test (age/educationLevel/fatigue/motivation)
        ne sont pas précisées par la fiche — transmises telles quelles, à tracer.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DecisionItemResponse' }
          description: "Réponses par item (répondus + non répondus)."
        sessionLanguage: { type: string, description: "Code langue (multiplicateur DT ; en/fr/de fournis, es/it/pt provisoires, ar → fallback)." }
        administrationMode:
          allOf: [ { $ref: '#/components/schemas/AdministrationMode' } ]
          default: SUPERVISED
        age: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        educationLevel: { type: string, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        fatigue: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        motivation: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }

    DecisionIndicators:
      type: object
      description: >
        Indicateurs « Je Décide » CALCULÉS PAR LE SERVEUR : détail par dimension
        (/18) + brut (/90) + SCW (/100) + niveau, interprétations automatiques
        (textes fiche, seuils provisoires), qualité de session et indicateurs
        temporels. SCW, niveau et seuils viennent de la couche provisoire.
      properties:
        rawScore: { type: integer, description: "Somme des dimensions exploitables /90" }
        rawMax: { type: integer, example: 90 }
        scwScore: { type: integer, description: "Score composite standardisé pondéré /100" }
        level: { type: string, description: "Élevé (≥75, fiche) · Normal · Borderline · Fragile (provisoires)" }
        dimensions:
          type: array
          items:
            type: object
            properties:
              dimension: { $ref: '#/components/schemas/DecisionDimension' }
              score: { type: integer, nullable: true, description: "/18 (null si bloc non exploitable)" }
              maxScore: { type: integer, example: 18 }
              exploitable: { type: boolean, description: "false si > 2 items manquants" }
              answeredItems: { type: integer }
        interpretations:
          type: array
          items: { type: string }
          description: "Interprétations automatiques déclenchées (textes fiche)."
        avgTimePlausible: { type: boolean }
        randomResponseRateOk: { type: boolean }
        impulsiveRateOk: { type: boolean }
        deviceLatencyWithinNorm: { type: boolean }
        sessionUsable: { type: boolean, description: "Verdict global de qualité de session." }
        averageResponseTimeMs: { type: number, format: double }
        medianResponseTimeMs: { type: number, format: double }
        stdDevResponseTimeMs: { type: number, format: double }
        impulsiveResponsePercent: { type: number, format: double, description: "% réponses sous le plancher (10 s)" }
        slowResponsePercent: { type: number, format: double, description: "% réponses au-delà du plafond (30 s)" }
        intraSessionVariability: { type: number, format: double, description: "Coefficient de variation des temps" }
        decisionChangesCount: { type: integer }
        averageResponseTimeAdjustedMs: { type: number, format: double, description: "Moyenne corrigée du calibrage (brut − offset)" }
        dtScoreCalibrationAdjusted: { type: boolean, description: "true si le temps imparti DT a intégré l'offset de calibrage" }
        calibrationApplied: { type: boolean }
        calibrationReliable: { type: boolean }
        calibrationOffsetMs: { type: number, format: double }

    TaskSchedulingMetrics:
      type: object
      description: >
        Métriques objectives du mini-jeu « Ordonnancement de tâches » (Planifik #2).
        Le serveur applique le barème /10 : dépendances (tout-ou-rien) + contraintes
        horaires (tout-ou-rien) + cohérence (0–2) + réajustements (score dérivé du
        nombre brut). Le client n'envoie jamais de points.
      required: [dependenciesRespected, timeConstraintsRespected, planningCoherence, adjustmentCount]
      properties:
        dependenciesRespected:
          type: boolean
          description: "Toutes les dépendances entre tâches respectées (tout-ou-rien → 3 pts / 0)."
        timeConstraintsRespected:
          type: boolean
          description: "Toutes les contraintes horaires respectées (tout-ou-rien → 3 pts / 0)."
        planningCoherence:
          type: integer
          minimum: 0
          maximum: 2
          description: "0 désordonné · 1 partiellement logique · 2 clair et structuré (0–2 pts)."
        adjustmentCount:
          type: integer
          minimum: 0
          description: "Nombre BRUT de réajustements ; score dérivé serveur (<2→2 · 2-4→1 · >4→0)."

    GameMetrics:
      # ⚠️ Chaque membre est encapsulé en { type: object, allOf: [ $ref ] } — et non
      # un $ref nu. À 6 membres exactement, le normaliseur d'openapi-generator 7.5.0
      # (processSimplifyOneOf) collecte le type de chaque membre dans un TreeSet ;
      # un $ref nu a un type null → TreeSet.add(null) lève une NPE. Le type: object
      # explicite évite ce cas (sémantique inchangée : le membre reste le schéma référencé).
      oneOf:
        - { type: object, allOf: [ { $ref: '#/components/schemas/OptimalPathMetrics' } ] }
        - { type: object, allOf: [ { $ref: '#/components/schemas/TaskSchedulingMetrics' } ] }
        - { type: object, allOf: [ { $ref: '#/components/schemas/MoveFastMetrics' } ] }
        - { type: object, allOf: [ { $ref: '#/components/schemas/PrevisionPuzzleMetrics' } ] }
        - { type: object, allOf: [ { $ref: '#/components/schemas/MemoryQuestMetrics' } ] }
        - { type: object, allOf: [ { $ref: '#/components/schemas/DecisionMetrics' } ] }

    SubmitResultRequest:
      type: object
      required: [miniGame, metrics]
      properties:
        miniGame: { $ref: '#/components/schemas/MiniGame' }
        metrics: { $ref: '#/components/schemas/GameMetrics' }
        deviceCalibration:
          allOf: [ { $ref: '#/components/schemas/DeviceCalibration' } ]
          nullable: true
          description: "Optionnel (n'existe pas chez les anciens clients). Socle de calibrage appareil."

    Score:
      type: object
      properties:
        rawPoints: { type: integer, example: 8 }
        maxPoints: { type: integer, example: 10 }
        normalized: { type: number, format: double, example: 80.0 }
        level: { type: string, example: "Bon à excellent" }

    Attempt:
      type: object
      properties:
        miniGame: { $ref: '#/components/schemas/MiniGame' }
        score: { $ref: '#/components/schemas/Score' }
        recordedAt: { type: string, format: date-time }

    GameSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        gameType: { $ref: '#/components/schemas/GameType' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        compositeRaw: { type: integer, example: 24 }
        compositeMax: { type: integer, example: 30 }
        normalized: { type: number, format: double, example: 80.0 }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        moveFastIndicators:
          allOf: [ { $ref: '#/components/schemas/MoveFastIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Move Fast."
        previsionPuzzleIndicators:
          allOf: [ { $ref: '#/components/schemas/PrevisionPuzzleIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Predictive Puzzle."
        memoryQuestIndicators:
          allOf: [ { $ref: '#/components/schemas/MemoryQuestIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne « J'investigue »."
        decisionIndicators:
          allOf: [ { $ref: '#/components/schemas/DecisionIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne « Je Décide »."
        scoreBreakdown:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ScoreBreakdownLine' }
          description: "Détail ligne par ligne du calcul du score (panneau de résultats)."
