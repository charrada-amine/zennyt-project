openapi: 3.0.3
info:
  title: Zennyt — Games API
  description: >
    Bounded context Games : jeux sérieux d'évaluation cognitive (Planifik,
    Move Fast, Memory Quest, Je Décide, Emotional Regulation et Continuous
    Attention, Visuomotor Coordination et Visuospatial Memory). Le client démarre une session, joue
    les mini-jeux et remonte
    des MÉTRIQUES objectives ; le score déterministe est calculé côté serveur.
    Ce contexte est indépendant : il n'expose et ne consomme aucun autre
    contexte, et publie son résultat via l'événement games.result.recorded.
  version: 1.5.0

servers:
  - url: https://api.zennyt.com/api/v1
    description: Production
  - url: https://api-staging.zennyt.com/api/v1
    description: Staging

tags:
  - name: Games
    description: Sessions de jeux sérieux et scoring
  - name: Games Admin
    description: Console d'administration des contenus, rotations, configurations et assets

security:
  - bearerAuth: []

paths:
  /games/sessions:
    post:
      tags: [Games]
      summary: Démarrer une session de jeu pour le joueur connecté
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSessionRequest' }
      responses:
        '201':
          description: Session créée (statut IN_PROGRESS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /games/sessions/{sessionId}/results:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games]
      summary: Soumettre les métriques d'un mini-jeu terminé
      description: >
        Le client n'envoie jamais de score, seulement des métriques mesurées.
        Le serveur calcule le score du mini-jeu ; au dernier mini-jeu du type,
        la session passe COMPLETED et l'événement games.result.recorded est émis.
        La session doit appartenir au joueur authentifié.

        Pour CONTINUOUS_ATTENTION_CORE, une structure, une séquence ou un tuple
        réponse/temps incohérent produit 400 et ne persiste rien. Une structure
        valide mais techniquement non comparable (session incomplète,
        interruption, arrière-plan ou divergence temporelle) produit 200 avec
        la session toujours IN_PROGRESS et sessionValid=false : le run brut est
        conservé pour audit, mais aucun Attempt ni événement n'est créé. Une
        nouvelle soumission du même run remplace atomiquement cet audit. Seule
        une soumission valide enregistre l'Attempt et complète la session.

        COORDINATION_TRACKING_CORE suit le même principe : la position de la
        balle, la distance et toutes les précisions sont recalculées par le
        serveur depuis les timestamps et coordonnées pointeur fixed-point. Une
        trace structurellement incohérente produit 400. Une trace dont
        technicalValid ou taskValid est faux reste audit-only, sans Attempt ni
        événement.

        OBJECT_LOCATION_BINDING_CORE applique le même modèle audit-only. Le
        serveur reconstruit le catalogue, les objets, leurs cellules d'origine
        et leur réserve depuis l'UUID de session. Le client ne transmet que les
        actions brutes. Une interruption, perte de focus, rotation, mise en
        arrière-plan ou divergence temporelle conserve le run sans créer
        d'Attempt ni d'événement. Même valide, son score reste provisoire : la
        session et l'Attempt sont enregistrés mais games.result.recorded n'est
        pas publié tant que le barème et l'intégration Fit Score ne sont pas
        validés par le psychologue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitResultRequest' }
      responses:
        '200':
          description: Résultat enregistré, session mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSession' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /games/sessions/{sessionId}/decision/items:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: language
        in: query
        required: false
        schema: { type: string, default: fr }
        description: >
          Code langue de passation. Sert UNIQUEMENT au multiplicateur linguistique du
          temps imparti DT (en/fr/de fournis, es/it/pt provisoires, autres → fallback).
    get:
      tags: [Games]
      summary: Items « Je Décide » de la forme assignée à cette session
      description: >
        Renvoie les 30 items de la forme parallèle tirée à la création de la session
        (banque de 120 items, 6 par dimension). La QUALITÉ des options — donc les
        points /3 — n'apparaît JAMAIS : la correction est faite serveur à la
        soumission, à partir de la forme relue sur la session et non du payload client.
      responses:
        '200':
          description: Items de la forme assignée, dans l'ordre de passation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionItemList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409':
          description: >
            La session n'est pas une session DECISION, ou aucune forme ne lui est
            assignée.

  /games/sessions/{sessionId}/emotional-radar/scenes:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Games]
      summary: Scènes d'Emotional Radar pour cette session
      description: >
        Renvoie les scènes (texte, image, vidéo) et la taxonomie émotion → nuances.
        La réponse attendue et l'explication ne sont JAMAIS incluses : la correction
        est faite serveur, scène par scène.
      responses:
        '200':
          description: Scènes de la session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmotionalRadarSceneList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /games/sessions/{sessionId}/emotional-radar/scenes/{sceneId}/answers:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sceneId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games]
      summary: Valider la réponse d'une scène et obtenir la correction
      description: >
        Le serveur note la réponse, la persiste, puis renvoie le feedback affiché par
        l'écran. C'est ce résultat persisté — et non le payload final — qui alimente
        le score du mini-jeu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmotionalRadarAnswerRequest' }
      responses:
        '200':
          description: Réponse notée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmotionalRadarFeedback' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /games/emotional-radar/scenes/{sceneId}/media:
    parameters:
      - { name: sceneId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games]
      summary: Téléverser le média (image ou vidéo) d'une scène
      description: >
        Gestion de contenu : stocke le fichier et rattache son URL à la scène.
        Endpoint historique conservé pour compatibilité, protégé par le rôle ADMIN.
        La nouvelle médiathèque utilise les endpoints /games/admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                altText: { type: string }
                transcript: { type: string }
      responses:
        '201':
          description: Média rattaché à la scène
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmotionalRadarScene' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /games/admin/overview:
    get:
      tags: [Games Admin]
      summary: Indicateurs de la console d'administration
      description: Réservé au rôle ADMIN. Les barèmes protégés ne sont jamais exposés en écriture.
      responses:
        '200':
          description: Compteurs et activité récente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }

  /games/admin/questions:
    get:
      tags: [Games Admin]
      summary: Lister les questions administrables
      parameters:
        - { name: contentType, in: query, schema: { $ref: '#/components/schemas/AdminContentType' } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Questions Je Décide et scènes Emotional Radar
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminQuestion' } }
    post:
      tags: [Games Admin]
      summary: Créer une question en brouillon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminQuestionWrite' }
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /games/admin/questions/{questionId}:
    parameters:
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Games Admin]
      summary: Modifier un brouillon de question administré
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminQuestionWrite' }
      responses:
        '200':
          description: Brouillon mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    delete:
      tags: [Games Admin]
      summary: Supprimer définitivement un brouillon de question administré
      responses:
        '204': { description: Brouillon supprimé }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /games/admin/questions/{questionId}/draft:
    parameters:
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Cloner une question système ou publiée dans un nouveau brouillon
      responses:
        '201':
          description: Brouillon éditable créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }

  /games/admin/questions/{questionId}/publish:
    parameters:
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Publier un brouillon de question
      responses:
        '200':
          description: Question publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }

  /games/admin/questions/{questionId}/archive:
    parameters:
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Archiver une question administrée
      responses:
        '200':
          description: Question archivée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }

  /games/admin/banks:
    get:
      tags: [Games Admin]
      summary: Lister les banques et leurs poids de rotation
      responses:
        '200':
          description: Banques versionnées
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminBank' } }
    post:
      tags: [Games Admin]
      summary: Créer une banque en brouillon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBankWrite' }
      responses:
        '201':
          description: Banque créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBank' }

  /games/admin/banks/{bankId}:
    parameters:
      - { name: bankId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Games Admin]
      summary: Modifier les métadonnées et le poids d'un brouillon de banque
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBankUpdate' }
      responses:
        '200':
          description: Banque mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBank' }
    delete:
      tags: [Games Admin]
      summary: Supprimer un brouillon de banque
      responses:
        '204': { description: Brouillon supprimé }

  /games/admin/banks/{bankId}/items:
    parameters:
      - { name: bankId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Games Admin]
      summary: Lire la composition ordonnée d'une banque
      responses:
        '200':
          description: Identifiants des questions dans l'ordre de jeu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBankItems' }
    put:
      tags: [Games Admin]
      summary: Remplacer atomiquement la composition d'un brouillon de banque
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBankItems' }
      responses:
        '200':
          description: Composition enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBank' }

  /games/admin/banks/{bankId}/publish:
    parameters:
      - { name: bankId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Valider et publier atomiquement une banque
      description: Les sessions déjà démarrées restent épinglées sur leur version.
      responses:
        '200':
          description: Banque publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBank' }
        '400':
          description: Banque invalide, vide ou déjà publiée

  /games/admin/banks/{bankId}/archive:
    parameters:
      - { name: bankId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Archiver une banque
      responses:
        '200':
          description: Banque archivée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBank' }

  /games/admin/configurations:
    get:
      tags: [Games Admin]
      summary: Lister les paramètres et modificateurs versionnés
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/AdminConfigurationKind' } }
      responses:
        '200':
          description: Configurations administrables et valeurs protégées en lecture seule
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminConfiguration' } }
    post:
      tags: [Games Admin]
      summary: Enregistrer une configuration en brouillon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminConfigurationWrite' }
      responses:
        '201':
          description: Configuration créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfiguration' }

  /games/admin/configurations/{configurationId}:
    parameters:
      - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Games Admin]
      summary: Modifier un brouillon de configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminConfigurationWrite' }
      responses:
        '200':
          description: Configuration mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfiguration' }
    delete:
      tags: [Games Admin]
      summary: Supprimer un brouillon de configuration
      responses:
        '204': { description: Brouillon supprimé }

  /games/admin/configurations/{configurationId}/publish:
    parameters:
      - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Publier une configuration non scoring
      responses:
        '200':
          description: Configuration publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfiguration' }

  /games/admin/configurations/{configurationId}/archive:
    parameters:
      - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Archiver une configuration publiée ou en brouillon
      responses:
        '200':
          description: Configuration archivée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfiguration' }

  /games/admin/assets:
    get:
      tags: [Games Admin]
      summary: Lister la médiathèque des jeux
      responses:
        '200':
          description: Assets administrés
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminAsset' } }
    post:
      tags: [Games Admin]
      summary: Téléverser un PNG ou SVG en brouillon
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, gameType, altText]
              properties:
                file: { type: string, format: binary }
                gameType: { type: string }
                altText: { type: string, minLength: 1 }
      responses:
        '201':
          description: Asset téléversé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAsset' }

  /games/admin/assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Games Admin]
      summary: Lire le contenu d'un asset stocké par le fallback de développement
      responses:
        '200':
          description: Contenu binaire de l'asset
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
    put:
      tags: [Games Admin]
      summary: Modifier l'affectation et le texte alternatif d'un asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAssetUpdate' }
      responses:
        '200':
          description: Asset mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAsset' }
    delete:
      tags: [Games Admin]
      summary: Supprimer un asset en brouillon et son fichier distant
      responses:
        '204': { description: Brouillon et fichier supprimés }

  /games/admin/assets/{assetId}/publish:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Publier un asset
      responses:
        '200':
          description: Asset publié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAsset' }

  /games/admin/assets/{assetId}/archive:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Games Admin]
      summary: Archiver un asset sans supprimer le fichier distant
      responses:
        '200':
          description: Asset archivé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAsset' }

  /games/admin/releases:
    get:
      tags: [Games Admin]
      summary: Journal des publications et actions d'administration
      responses:
        '200':
          description: Audit immuable
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminAuditEntry' } }

components:
  securitySchemes:
    bearerAuth: { $ref: './common.openapi.yaml#/components/securitySchemes/bearerAuth' }

  schemas:
    AdminStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    AdminContentType:
      type: string
      enum: [DECISION_SCENARIO, EMOTIONAL_RADAR_SCENE]

    AdminConfigurationKind:
      type: string
      enum: [SETTINGS, MODIFIERS]

    AdminOverview:
      type: object
      required: [questionCount, publishedBankCount, draftCount, assetCount]
      properties:
        questionCount: { type: integer, minimum: 0 }
        publishedBankCount: { type: integer, minimum: 0 }
        draftCount: { type: integer, minimum: 0 }
        assetCount: { type: integer, minimum: 0 }

    AdminQuestion:
      type: object
      required: [id, externalCode, contentType, prompt, payload, status, managed, updatedAt]
      properties:
        id: { type: string, format: uuid }
        externalCode: { type: string }
        contentType: { $ref: '#/components/schemas/AdminContentType' }
        prompt: { type: string }
        bankName: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        sourceId: { type: string, format: uuid, nullable: true }
        managed:
          type: boolean
          description: true pour un contenu versionné modifiable, false pour un catalogue système en lecture seule
        status: { $ref: '#/components/schemas/AdminStatus' }
        updatedAt: { type: string, format: date-time }

    AdminQuestionWrite:
      type: object
      required: [externalCode, contentType, prompt, payload]
      properties:
        externalCode: { type: string, minLength: 1, maxLength: 64 }
        contentType: { $ref: '#/components/schemas/AdminContentType' }
        prompt: { type: string, minLength: 1 }
        payload:
          type: object
          additionalProperties: true
          description: Données éditoriales versionnées. Aucune clé de score n'est acceptée.

    AdminBank:
      type: object
      required: [id, code, name, contentType, itemCount, rotationWeight, version, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        contentType: { $ref: '#/components/schemas/AdminContentType' }
        itemCount: { type: integer, minimum: 0 }
        rotationWeight: { type: integer, minimum: 0, maximum: 100 }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AdminStatus' }
        updatedAt: { type: string, format: date-time }

    AdminBankWrite:
      type: object
      required: [code, name, contentType, rotationWeight]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]+$' }
        name: { type: string, minLength: 1 }
        contentType: { $ref: '#/components/schemas/AdminContentType' }
        rotationWeight: { type: integer, minimum: 0, maximum: 100 }
        sourceBankId:
          type: string
          format: uuid
          nullable: true
          description: Banque à cloner pour composer immédiatement une nouvelle version.

    AdminBankUpdate:
      type: object
      required: [name, rotationWeight]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        rotationWeight: { type: integer, minimum: 0, maximum: 100 }

    AdminBankItems:
      type: object
      required: [questionIds]
      properties:
        questionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    AdminConfiguration:
      type: object
      required: [id, gameType, kind, version, values, protectedScoring, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        gameType: { type: string }
        kind: { $ref: '#/components/schemas/AdminConfigurationKind' }
        version: { type: integer, minimum: 1 }
        values: { type: object, additionalProperties: true }
        protectedScoring: { type: boolean, description: Toujours false pour une ressource modifiable }
        status: { $ref: '#/components/schemas/AdminStatus' }
        updatedAt: { type: string, format: date-time }

    AdminConfigurationWrite:
      type: object
      required: [gameType, kind, values]
      properties:
        gameType: { type: string }
        kind: { $ref: '#/components/schemas/AdminConfigurationKind' }
        values:
          type: object
          additionalProperties: true
          description: Paramètres de déroulé, accessibilité et présentation uniquement.

    AdminAsset:
      type: object
      required: [id, gameType, filename, mediaType, url, altText, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameType: { type: string }
        filename: { type: string }
        mediaType: { type: string, enum: [PNG, SVG] }
        url: { type: string, format: uri }
        altText: { type: string }
        status: { $ref: '#/components/schemas/AdminStatus' }
        createdAt: { type: string, format: date-time }

    AdminAssetUpdate:
      type: object
      required: [gameType, altText]
      properties:
        gameType: { type: string, minLength: 1, maxLength: 48 }
        altText: { type: string, minLength: 1, maxLength: 2000 }

    AdminAuditEntry:
      type: object
      required: [id, action, entityType, entityId, actorId, details, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    GameType:
      type: string
      description: >
        Type de jeu sérieux (un domaine cognitif = un type). EMOTIONAL_REGULATION
        (« Je gère ») héberge Emotional Radar et Reflective Pause, sur le modèle
        de PLANIFIK qui héberge ses trois mini-jeux. CONTINUOUS_ATTENTION reste
        distinct de MOVE_FAST : « Je continue » apparaît dans la même catégorie
        mobile sans modifier les sessions ni le barème historique de Move Fast.
        VISUOMOTOR_COORDINATION (« Je coordonne ») est lui aussi indépendant.
        VISUOSPATIAL_MEMORY (« Je place ») apparaît à côté de Memory Quest sans
        modifier son agrégat ni son barème historique.
      enum: [PLANIFIK, MOVE_FAST, MEMORY_QUEST, DECISION, EMOTIONAL_REGULATION, CONTINUOUS_ATTENTION, VISUOMOTOR_COORDINATION, VISUOSPATIAL_MEMORY]

    MiniGame:
      type: string
      description: >
        Mini-jeu évalué dans une session. DECISION_CORE (« Je Décide ») est déclaré
        mais non jouable tant que le catalogue de scénarios est vide (même patron
        que TASK_SCHEDULING avant implémentation). CONTINUOUS_ATTENTION_CORE
        implémente le protocole Long Rosvold CPT X/AX ; il ne reprend aucune norme
        ni interprétation du Conners CPT-3. COORDINATION_TRACKING_CORE implémente
        une trajectoire carrée fixe, horaire et prédictible ; aucun score,
        inside/outside ni distance calculée par le client n'est accepté.
        OBJECT_LOCATION_BINDING_CORE ne reçoit ni grille attendue, ni position
        d'origine, ni score : le serveur les reconstruit.
      enum: [OPTIMAL_PATH, TASK_SCHEDULING, PREVISION_PUZZLE, MOVE_FAST_CORE, MEMORY_QUEST_CORE, DECISION_CORE, EMOTIONAL_RADAR_CORE, REFLECTIVE_PAUSE_CORE, CONTINUOUS_ATTENTION_CORE, COORDINATION_TRACKING_CORE, OBJECT_LOCATION_BINDING_CORE]

    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]

    StartSessionRequest:
      type: object
      required: [gameType]
      properties:
        gameType: { $ref: '#/components/schemas/GameType' }

    CostlyZonesAvoided:
      type: string
      description: >
        Degré d'évitement des zones coûteuses sur un niveau. Barème serveur :
        TOTAL=2, PARTIAL=1, NONE=0 (raffinement à valider par le psychologue).
      enum: [TOTAL, PARTIAL, NONE]

    SecondaryObjectivesReached:
      type: string
      description: >
        Atteinte des objectifs secondaires d'un niveau. Barème serveur : YES=1,
        NO=0, PARTIAL=règle à valider (0 par défaut).
      enum: [YES, PARTIAL, NO]

    OptimalPathLevelMetrics:
      type: object
      description: Métriques objectives d'UN niveau de « Chemin Optimal ».
      required: [attempts, pathLength, optimalLength, costlyZonesAvoided, secondaryObjectivesReached]
      properties:
        levelIndex: { type: integer, minimum: 0, description: "Index du niveau (0-based)" }
        attempts: { type: integer, minimum: 1, description: "Essais avant validation du niveau" }
        pathLength: { type: integer, minimum: 0, description: "Longueur du chemin tracé" }
        optimalLength: { type: integer, minimum: 1, description: "Longueur du chemin optimal" }
        costlyZonesAvoided: { $ref: '#/components/schemas/CostlyZonesAvoided' }
        secondaryObjectivesReached: { $ref: '#/components/schemas/SecondaryObjectivesReached' }

    OptimalPathMetrics:
      type: object
      description: >
        Métriques objectives du mini-jeu « Chemin Optimal ». Le mini-jeu enchaîne
        plusieurs niveaux : envoyer `levels` (une entrée par niveau) — le serveur
        note chaque niveau /10 puis agrège par moyenne arrondie (un seul Attempt).
        Les champs plats restent acceptés en mode mono-niveau (compatibilité).
      properties:
        levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OptimalPathLevelMetrics' }
          description: "Métriques par niveau (mode multi-niveaux, recommandé)."
        attempts: { type: integer, minimum: 1, description: "Mono-niveau : essais avant validation" }
        pathLength: { type: integer, minimum: 0, description: "Mono-niveau : longueur du chemin tracé" }
        optimalLength: { type: integer, minimum: 1, description: "Mono-niveau : longueur du chemin optimal" }
        costlyZonesAvoided: { type: boolean, description: "Mono-niveau : évitement total (true) / aucun (false)" }
        secondaryObjectives: { type: integer, minimum: 0, description: "Mono-niveau : nb d'objectifs secondaires atteints" }

    CalibrationMethod:
      type: string
      description: >
        Méthode de calibrage appareil. « technique » = mesure machine pure
        (latence affichage + traitement d'entrée). « hardware_profile_fallback »
        = profil matériel seul quand la mesure directe est indisponible (fiabilité réduite).
      enum: [technique, hardware_profile_fallback]

    InputMode:
      type: string
      enum: [keyboard, touch, mouse, swipe]

    DeviceCategory:
      type: string
      enum: [mobile, tablet, desktop]

    DeviceCalibration:
      type: object
      description: >
        Socle de calibrage APPAREIL (méthode « technique » pure — sépare la latence
        matérielle du temps de réaction cognitif). Optionnel. Les temps bruts restent
        stockés tels quels ; la correction (calibrationOffsetMs) s'applique au calcul
        des indicateurs temporels. Les essais d'échauffement ne servent JAMAIS au calibrage.
      required: [calibrationMethod, inputMode, deviceCategory, refreshRateHz]
      properties:
        calibrationMethod: { $ref: '#/components/schemas/CalibrationMethod' }
        inputMode: { $ref: '#/components/schemas/InputMode' }
        deviceCategory: { $ref: '#/components/schemas/DeviceCategory' }
        refreshRateHz:
          type: number
          format: double
          description: "Détecté via requestAnimationFrame / équivalent Flutter."
        hardwareConcurrency:
          type: integer
          nullable: true
          description: "Détection passive (nullable)."
        deviceMemoryGb:
          type: number
          format: double
          nullable: true
          description: "Détection passive (nullable — absent iOS)."
        inputProcessingLatencyMs:
          type: number
          format: double
          nullable: true
          description: >
            Médiane du traitement d'entrée (Event-Timing-équivalent) sur TOUTE la
            session — mesure machine pure. Absent en fallback.
        displayLatencyMs:
          type: number
          format: double
          readOnly: true
          description: "Calculé serveur = (1000 / refreshRateHz) / 2 (théorique)."
        calibrationOffsetMs:
          type: number
          format: double
          readOnly: true
          description: "Calculé serveur = displayLatencyMs + inputProcessingLatencyMs."

    MoveFastRule:
      type: string
      description: Règle active sur un essai (flexibilité cognitive).
      enum: [ORIENTATION, MOVEMENT]

    MoveFastResponseItem:
      type: object
      description: >
        Un essai « Je bouge » mesuré (essais d'échauffement compris, marqués
        practiceTrial). Le client n'envoie que des mesures — jamais de points ni
        d'indicateurs dérivés.
      required: [correct, reactionTimeMs, ruleActive]
      properties:
        practiceTrial:
          type: boolean
          default: false
          description: "true si essai d'échauffement (exclu du scoring et des stats par le serveur)."
        correct:
          type: boolean
          description: "true si la réponse était correcte."
        reactionTimeMs:
          type: integer
          minimum: 0
          description: "Temps de réaction mesuré, en millisecondes."
        ruleActive: { $ref: '#/components/schemas/MoveFastRule' }
        isSwitchTrial:
          type: boolean
          default: false
          description: "true si la règle a changé par rapport à l'essai précédent."
        appliedOldRule:
          type: boolean
          default: false
          description: "true si l'erreur correspond à l'application de l'ancienne règle (erreur persévérative)."

    MoveFastMetrics:
      type: object
      description: >
        Métriques objectives du jeu « Je bouge / Move Fast ». Le serveur exclut
        les essais d'échauffement, rejoue la séquence correct/incorrect pour
        appliquer le barème en escalade, puis dérive les indicateurs de
        flexibilité cognitive (MoveFastIndicators, dans la réponse).
      required: [practiceTrialExcludedCount, responses]
      properties:
        practiceTrialExcludedCount:
          type: integer
          minimum: 0
          description: >
            Nombre d'essais d'échauffement exclus. Doit être cohérent avec le
            nombre d'entrées responses ayant practiceTrial=true.
        responses:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MoveFastResponseItem' }
          description: "Essais mesurés dans l'ordre de jeu (échauffement inclus)."

    ContinuousAttentionPhase:
      type: string
      description: >
        Phase du protocole Long Rosvold CPT. Les phases PRACTICE sont persistées
        pour l'audit mais toujours exclues du score et des indicateurs finaux.
      enum: [X_PRACTICE, X_TEST, AX_PRACTICE, AX_TEST]

    ContinuousAttentionTestPhase:
      type: string
      description: Phase de test cotée ; une phase PRACTICE n'apparaît jamais dans les indicateurs.
      enum: [X_TEST, AX_TEST]

    ContinuousAttentionProtocolVersion:
      type: string
      description: Version figée de la génération et de la validation du protocole.
      enum: [ROSVOLD_LONG_V1]

    ContinuousAttentionInputSource:
      type: string
      description: Source sémantique de la première réponse reçue pendant la fenêtre.
      enum: [TOUCH, KEYBOARD]

    ContinuousAttentionTrialMetric:
      type: object
      description: >
        Mesures brutes d'un essai « Je continue ». `correct` est conservé pour
        l'audit du client, mais le serveur le recalcule depuis phase,
        previousLetter/currentLetter et responseCode puis rejette toute divergence.
        La réponse est acceptée uniquement pendant les 690 ms d'affichage.
      required:
        - trialIndex
        - previousLetter
        - currentLetter
        - responseCode
        - correct
        - latencyMs
        - scheduledOnsetMs
        - actualOnsetMs
        - responseTimestampMs
        - actualDisplayDurationMs
        - actualIsiDurationMs
        - inputSource
        - extraResponseCount
        - interrupted
      properties:
        trialIndex:
          type: integer
          minimum: 1
          maximum: 31
          description: Index 1-based dans le bloc.
        previousLetter:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1
          pattern: '^[A-Z]$'
          description: >
            null uniquement au premier essai de la famille X et au premier essai
            de la famille AX. La lettre précédente reste continue de PRACTICE
            vers TEST et entre les blocs d'une même famille. Le générateur
            empêche tout AX non planifié à une frontière.
        currentLetter:
          type: string
          minLength: 1
          maxLength: 1
          pattern: '^[A-Z]$'
        responseCode:
          type: integer
          enum: [0, 57]
          description: "57 = réponse (barre d'espace ou tap sémantique) ; 0 = aucune réponse."
        correct:
          type: integer
          enum: [0, 1]
          description: Valeur client contrôlée et recalculée serveur.
        latencyMs:
          type: integer
          nullable: true
          minimum: 0
          maximum: 689
          description: >
            null quand responseCode=0 ; temps depuis l'apparition effective de
            la lettre. Fenêtre valide [0, 690 ms) : 689 accepté, 690 rejeté.
        scheduledOnsetMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Début prévu relatif au début de la phase, selon la timeline absolue
            trialPosition × 920 ms. Même origine monotone que actualOnsetMs et
            responseTimestampMs.
        actualOnsetMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Début réellement observé, relatif au même début de phase et mesuré
            par la même horloge monotone que scheduledOnsetMs.
        responseTimestampMs:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: >
            Timestamp monotone relatif au même début de phase ; null sans
            réponse. Pour une réponse, responseTimestampMs - actualOnsetMs doit
            être exactement égal à latencyMs.
        actualDisplayDurationMs:
          type: integer
          minimum: 0
          description: Durée réelle d'affichage de la lettre, cible nominale 690 ms.
        actualIsiDurationMs:
          type: integer
          minimum: 0
          description: Durée réelle de l'écran vide, cible nominale 230 ms.
        inputSource:
          allOf: [ { $ref: '#/components/schemas/ContinuousAttentionInputSource' } ]
          nullable: true
          description: null quand responseCode=0 ; TOUCH ou KEYBOARD quand responseCode=57.
        extraResponseCount:
          type: integer
          minimum: 0
          description: Réponses supplémentaires pendant le même essai, ignorées pour la cotation.
        interrupted:
          type: boolean
          description: true si l'application a perdu le focus ou si une pause a interrompu l'essai.

    ContinuousAttentionBlockMetric:
      type: object
      description: >
        Un bloc Rosvold de 31 lettres. X_PRACTICE/X_TEST contiennent exactement
        8 cibles X ; AX_PRACTICE/AX_TEST exactement 6 séquences AX, sans AX accidentel.
      required: [phase, blockIndex, trials]
      properties:
        phase: { $ref: '#/components/schemas/ContinuousAttentionPhase' }
        blockIndex:
          type: integer
          minimum: 1
          maximum: 20
          description: Index 1-based dans la phase (1–2 pratique, 1–20 test).
        trials:
          type: array
          minItems: 31
          maxItems: 31
          items: { $ref: '#/components/schemas/ContinuousAttentionTrialMetric' }

    ContinuousAttentionMetrics:
      type: object
      description: >
        Protocole Long Rosvold CPT adulte complet : X puis AX, 2 blocs de pratique
        + 20 blocs de test par phase, 31 essais par bloc, lettre 690 ms et écran
        vide 230 ms. La séquence est générée de façon déterministe depuis l'id de
        session et `protocolVersion`, puis reconstruite et validée par le serveur.
        Ce protocole n'est PAS le Conners CPT-3 et n'utilise aucune de ses normes.

        Génération ROSVOLD_LONG_V1, normative pour Java et Dart :
        seedMaterial = lower(sessionId) + "|" + protocolVersion ; FNV-1a 32 bits
        sur UTF-8 ; état zéro remplacé par 0x6D2B79F5 ; xorshift32 unsigned
        (<<13, >>>17, <<5), réduction par modulo non signé et Fisher-Yates
        descendant. Un bloc X construit 8 X puis 23 tirages avec remplacement
        dans ABCDEFGHIJKLMNOPQRSTUVWYZ avant mélange. Un bloc AX mélange 6 tokens
        AX_PAIR et 19 tokens distracteurs ; AX_PAIR s'étend en A,X, tandis qu'un
        distracteur est tiré avec remplacement dans A-Z et X est retiré si la
        lettre émise précédente est A. previousLetter est réinitialisée avant
        X_PRACTICE puis avant AX_PRACTICE seulement.

        Vecteur canonique pour la session
        00000000-0000-4000-8000-000000000001 : seed 0xFC0A124C,
        FNV du flux aplati 0xD9278D75, premier bloc
        HZNXXAJGQXXYYKEOCXFVXOXLJLNNIXH, premier bloc AX
        AXHAXDNCNOJAAXVAXAXZUAXAIIPACHW, dernier bloc
        JYGAXJBYARQQKAXFSPAXXAXFYAXAXDY.
      required:
        - protocolVersion
        - blocks
        - sessionCompleted
        - interrupted
        - backgroundEventCount
        - droppedFrameCount
      properties:
        protocolVersion:
          $ref: '#/components/schemas/ContinuousAttentionProtocolVersion'
        blocks:
          type: array
          minItems: 44
          maxItems: 44
          items: { $ref: '#/components/schemas/ContinuousAttentionBlockMetric' }
          description: >
            Ordre obligatoire : 2 X_PRACTICE, 20 X_TEST, 2 AX_PRACTICE,
            20 AX_TEST. Les 1 364 essais, entraînement compris, sont persistés
            pour un run structurellement valide, y compris lorsqu'il est
            conservé audit-only car techniquement non comparable.
        sessionCompleted:
          type: boolean
        interrupted:
          type: boolean
          description: >
            true si une phase de test soumise a été interrompue ou si
            l'application a perdu le focus pendant un stimulus. Après une
            reprise locale complète, le client soumet uniquement le run final :
            il n'agrège pas les essais abandonnés au run recommencé.
        backgroundEventCount:
          type: integer
          minimum: 0
        droppedFrameCount:
          type: integer
          minimum: 0
          description: Frames manquées observées pendant la timeline de stimuli.

    ContinuousAttentionEpochIndicators:
      type: object
      description: Agrégat descriptif d'une époque de 5 blocs de test.
      required:
        - phase
        - epochIndex
        - hitRatePercent
        - falseAlarmRatePercent
        - averageHitReactionTimeMs
        - reactionTimeVariabilityMs
        - dPrime
      properties:
        phase: { $ref: '#/components/schemas/ContinuousAttentionTestPhase' }
        epochIndex: { type: integer, minimum: 1, maximum: 4 }
        hitRatePercent: { type: number, format: double }
        falseAlarmRatePercent: { type: number, format: double }
        averageHitReactionTimeMs: { type: number, format: double, nullable: true }
        reactionTimeVariabilityMs: { type: number, format: double, nullable: true }
        dPrime:
          type: number
          format: double
          description: Indicateur descriptif avec correction log-linéaire ; jamais intégré au score.

    ContinuousAttentionPhaseIndicators:
      type: object
      description: Indicateurs descriptifs calculés côté serveur pour une phase de test.
      required:
        - phase
        - targetCount
        - nonTargetCount
        - hitCount
        - omissionCount
        - commissionCount
        - correctRejectionCount
        - hitRatePercent
        - omissionRatePercent
        - falseAlarmRatePercent
        - correctRejectionRatePercent
        - balancedAccuracyPercent
        - averageHitReactionTimeMs
        - medianHitReactionTimeMs
        - stdDevHitReactionTimeMs
        - reactionTimeCoefficientOfVariation
        - dPrime
        - responseBiasC
      properties:
        phase: { $ref: '#/components/schemas/ContinuousAttentionTestPhase' }
        targetCount: { type: integer }
        nonTargetCount: { type: integer }
        hitCount: { type: integer }
        omissionCount: { type: integer }
        commissionCount: { type: integer }
        correctRejectionCount: { type: integer }
        hitRatePercent: { type: number, format: double }
        omissionRatePercent: { type: number, format: double }
        falseAlarmRatePercent: { type: number, format: double }
        correctRejectionRatePercent: { type: number, format: double }
        balancedAccuracyPercent:
          type: number
          format: double
          description: "(hitRate + correctRejectionRate) / 2 ; composante du score provisoire."
        averageHitReactionTimeMs: { type: number, format: double, nullable: true }
        medianHitReactionTimeMs: { type: number, format: double, nullable: true }
        stdDevHitReactionTimeMs: { type: number, format: double, nullable: true }
        reactionTimeCoefficientOfVariation:
          type: number
          format: double
          nullable: true
          description: "écart-type / moyenne des latences des hits corrects."
        dPrime:
          type: number
          format: double
          description: >
            Descriptif uniquement. H=(hits+0.5)/(targets+1),
            FA=(commissions+0.5)/(nonTargets+1), dPrime=Z(H)-Z(FA).
        responseBiasC:
          type: number
          format: double
          description: >
            Descriptif uniquement ; c=-0.5×(Z(H)+Z(FA)), jamais intégré au score.

    ContinuousAttentionIndicators:
      type: object
      description: >
        Rapport serveur « Je continue ». Le score provisoire /100 est uniquement
        la moyenne des balanced accuracies X_TEST et AX_TEST. d-prime, biais c et
        temps de réaction restent descriptifs, sans diagnostic, percentile,
        classement ni norme Conners. Le niveau du Score associé est la constante
        neutre "Descriptive — provisional", jamais une bande dérivée du résultat.
      required:
        - protocolVersion
        - completed
        - sessionValid
        - interrupted
        - provisionalAccuracyScore
        - xPhase
        - axPhase
        - epochs
        - axTargetCount
        - ayCount
        - bxCount
        - byCount
        - extraResponseCount
        - backgroundEventCount
        - droppedFrameCount
        - timingDeviationCount
        - validityIssues
      properties:
        protocolVersion: { $ref: '#/components/schemas/ContinuousAttentionProtocolVersion' }
        completed: { type: boolean }
        sessionValid:
          type: boolean
          description: >
            true uniquement si sessionCompleted=true, aucune interruption,
            aucun passage arrière-plan et aucun écart >100 ms entre onset prévu
            et réel, durée d'affichage et 690 ms, ou ISI et 230 ms. Un écart de
            100 ms est accepté ; cette tolérance est un critère de validité,
            jamais une composante du score. Une structure invalide est rejetée
            avant de produire ce rapport.
        interrupted: { type: boolean }
        provisionalAccuracyScore:
          type: integer
          minimum: 0
          maximum: 100
        xPhase:
          allOf: [ { $ref: '#/components/schemas/ContinuousAttentionPhaseIndicators' } ]
          description: X_TEST uniquement ; 160 cibles et 460 non-cibles attendues.
        axPhase:
          allOf: [ { $ref: '#/components/schemas/ContinuousAttentionPhaseIndicators' } ]
          description: AX_TEST uniquement ; 120 cibles et 500 non-cibles attendues.
        epochs:
          type: array
          minItems: 8
          maxItems: 8
          description: Quatre époques de 5 blocs pour X_TEST puis quatre pour AX_TEST.
          items: { $ref: '#/components/schemas/ContinuousAttentionEpochIndicators' }
        axTargetCount:
          type: integer
          description: Séquences AX cibles dans AX_TEST uniquement ; attendu 120.
        ayCount:
          type: integer
          description: A suivi d'une lettre non-X dans AX_TEST uniquement.
        bxCount:
          type: integer
          description: X précédé d'une lettre non-A dans AX_TEST uniquement.
        byCount:
          type: integer
          description: Autres paires dans AX_TEST uniquement.
        extraResponseCount:
          type: integer
          description: Somme sur les 44 blocs, pratique comprise ; descriptif hors score.
        backgroundEventCount:
          type: integer
          description: Événements arrière-plan pendant les stimuli du run soumis.
        droppedFrameCount:
          type: integer
          description: >
            Frames manquées sur les stimuli du run soumis ; descriptif. La
            validité dépend des timings réellement mesurés, pas directement de
            ce compteur.
        timingDeviationCount:
          type: integer
          description: >
            Essais dont l'onset réel, l'affichage ou l'ISI sortent de la
            tolérance technique provisoire de 100 ms.
        validityIssues:
          type: array
          items: { type: string }

    CoordinationProtocolVersion:
      type: string
      description: >
        Version figée de « Je coordonne ». PROVISOIRE — géométrie et vitesses
        non validées par le psychologue. La balle suit le carré normalisé [0,1]
        avec un inset 0.16, démarre au coin supérieur gauche et avance
        continûment dans le sens horaire. Un tour lent dure 7000 ms et un tour
        rapide 3500 ms.
      enum: [FIXED_SQUARE_CW_V1]

    CoordinationPhase:
      type: string
      description: PRACTICE est persistée pour audit mais exclue de toute cotation.
      enum: [PRACTICE, TEST]

    CoordinationSpeed:
      type: string
      enum: [SLOW, FAST]

    CoordinationInputSource:
      type: string
      description: Modalité de pointage auditée pour l'ensemble du run.
      enum: [MOUSE, TOUCH, STYLUS]

    CoordinationPointerSample:
      type: object
      description: >
        Position brute du pointeur sur une frame. Les coordonnées sont des
        fixed-point normalisés dans [0, 1_000_000] relativement au plateau
        carré. La position de la balle, la distance et l'état visuel ne sont
        jamais transmis : le serveur les reconstruit depuis timestampMs.
      required: [sampleIndex, timestampMs, pointerPresent, pointerX, pointerY]
      properties:
        sampleIndex:
          type: integer
          minimum: 1
          description: Index 1-based dans le segment.
        timestampMs:
          type: integer
          format: int64
          minimum: 0
          description: Temps monotone relatif au déclenchement initial du mouvement.
        pointerPresent:
          type: boolean
          description: false lorsque le doigt/curseur ne fournit aucune position exploitable.
        pointerX:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
          description: Requis lorsque pointerPresent=true, null sinon.
        pointerY:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
          description: Requis lorsque pointerPresent=true, null sinon.

    CoordinationSegmentMetric:
      type: object
      description: >
        Segment contigu de la trajectoire. phase, speed et nominalDurationMs
        sont contrôlés contre la séquence FIXED_SQUARE_CW_V1 ; le client ne
        peut pas choisir l'ordre ni la vitesse.
      required:
        - phase
        - segmentIndex
        - speed
        - nominalDurationMs
        - actualStartMs
        - actualEndMs
        - samples
      properties:
        phase: { $ref: '#/components/schemas/CoordinationPhase' }
        segmentIndex:
          type: integer
          minimum: 1
          maximum: 14
          description: Index global 1-based ; 1–2 pratique, 3–14 test.
        speed: { $ref: '#/components/schemas/CoordinationSpeed' }
        nominalDurationMs:
          type: integer
          enum: [2333, 7000]
        actualStartMs:
          type: integer
          format: int64
          minimum: 0
        actualEndMs:
          type: integer
          format: int64
          minimum: 1
        samples:
          type: array
          minItems: 2
          maxItems: 2000
          items: { $ref: '#/components/schemas/CoordinationPointerSample' }

    CoordinationMetrics:
      type: object
      description: >
        Trace brute complète de « Je coordonne » : deux segments de pratique
        de 7000 ms (lent, rapide), puis douze segments test dans l'ordre
        7000 lent, 7000 rapide, 2333 lent, 2333 rapide, répété trois fois.
        La pratique est exclue. Le serveur reconstruit une trajectoire carrée
        horaire continue et calcule une précision pondérée par le temps. La
        distance est normalisée par la diagonale du plateau vers [0,1200] ;
        un pointeur absent vaut 1200. Le client n'envoie aucun agrégat ni score.
      required:
        - protocolVersion
        - inputSource
        - coordinationSegments
        - sessionCompleted
        - interrupted
        - backgroundEventCount
        - droppedFrameCount
      properties:
        protocolVersion: { $ref: '#/components/schemas/CoordinationProtocolVersion' }
        inputSource: { $ref: '#/components/schemas/CoordinationInputSource' }
        coordinationSegments:
          type: array
          minItems: 14
          maxItems: 14
          items: { $ref: '#/components/schemas/CoordinationSegmentMetric' }
        sessionCompleted: { type: boolean }
        interrupted:
          type: boolean
          description: >
            Toute pause ou perte de focus pendant la mesure rend le run
            audit-only : aucun Attempt/event/Fit Score n'est créé.
        backgroundEventCount: { type: integer, minimum: 0 }
        droppedFrameCount:
          type: integer
          minimum: 0
          description: Descriptif uniquement ; jamais intégré au score ni à taskValid.

    CoordinationIndicators:
      type: object
      description: >
        Rapport calculé côté serveur. Le score /100 provisoire est uniquement
        roundHalfUp(overallAccuracyPercent). Les sous-précisions et la distance
        sont descriptives, sans diagnostic, percentile ni classement.
      required:
        - protocolVersion
        - inputSource
        - completed
        - sessionValid
        - interrupted
        - provisionalAccuracyScore
        - overallAccuracyPercent
        - fastAccuracyPercent
        - slowAccuracyPercent
        - longSegmentAccuracyPercent
        - shortSegmentAccuracyPercent
        - averageCenterDistance
        - testExecutionTimeMs
        - accuracyValid
        - executionTimeValid
        - taskValid
        - technicalValid
        - sampleCount
        - absentSampleCount
        - backgroundEventCount
        - droppedFrameCount
        - timingDeviationCount
        - samplingGapCount
        - validityIssues
      properties:
        protocolVersion: { $ref: '#/components/schemas/CoordinationProtocolVersion' }
        inputSource: { $ref: '#/components/schemas/CoordinationInputSource' }
        completed: { type: boolean }
        sessionValid:
          type: boolean
          description: >
            true si taskValid est vrai, la session est complète et aucune
            interruption/perte de focus n'a eu lieu.
        interrupted: { type: boolean }
        provisionalAccuracyScore: { type: integer, minimum: 0, maximum: 100 }
        overallAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        fastAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        slowAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        longSegmentAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        shortSegmentAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        averageCenterDistance:
          type: number
          format: double
          minimum: 0
          maximum: 1200
          description: Distance moyenne pondérée, diagonale normalisée vers [0,1200].
        testExecutionTimeMs:
          type: integer
          format: int64
          description: Durée réelle des douze segments test ; valide entre 54000 et 58000 inclus.
        accuracyValid: { type: boolean, description: "Précision serveur finie dans [0,100]." }
        executionTimeValid: { type: boolean, description: "testExecutionTimeMs dans [54000,58000]." }
        taskValid: { type: boolean, description: accuracyValid AND executionTimeValid. }
        technicalValid:
          type: boolean
          description: >
            completed AND NOT interrupted AND backgroundEventCount = 0 AND
            timingDeviationCount = 0. Les gaps d'échantillonnage et frames
            perdues restent descriptifs ; le score est toutefois réintégré
            serveur sur une grille canonique de 1 ms.
        sampleCount: { type: integer, minimum: 0 }
        absentSampleCount: { type: integer, minimum: 0 }
        backgroundEventCount: { type: integer, minimum: 0 }
        droppedFrameCount: { type: integer, minimum: 0 }
        timingDeviationCount:
          type: integer
          minimum: 0
          description: >
            Nombre de segments test hors tolérance. N'entre pas dans le score
            ni taskValid, mais rend technicalValid faux.
        samplingGapCount:
          type: integer
          minimum: 0
          description: Descriptif uniquement ; jamais intégré au score ni à taskValid.
        validityIssues:
          type: array
          items: { type: string }

    ObjectLocationProtocolVersion:
      type: string
      description: >
        Version figée du protocole provisoire de « Je place ». La progression,
        la grille et les timings peuvent être remplacés dans la configuration
        serveur sans modifier le moteur ni les métriques brutes.
      enum: [OBJECT_LOCATION_FINE_V1]

    ObjectLocationPhase:
      type: string
      description: PRACTICE est persistée pour audit mais exclue de toute cotation.
      enum: [PRACTICE, TEST]

    ObjectLocationCompletionReason:
      type: string
      description: >
        MAX_LEVELS après les six niveaux ; STOP_RULE après deux échecs
        consécutifs (jamais avant trois niveaux) ; TECHNICAL_INTERRUPTION pour
        un run incomplet conservé audit-only.
      enum: [MAX_LEVELS, STOP_RULE, TECHNICAL_INTERRUPTION]

    ObjectLocationActionType:
      type: string
      enum: [PLACE, RETURN_TO_RESERVE]

    ObjectLocationPlacementAction:
      type: object
      description: >
        Action brute pendant la restitution. objectId doit appartenir au niveau
        déterministe reconstruit par le serveur. PLACE exige targetCellIndex ;
        RETURN_TO_RESERVE exige null. Une cellule occupée éjecte son objet vers
        la réserve. Aucun état correct/incorrect n'est transmis.
      required: [actionIndex, actionType, objectId, timestampMs]
      properties:
        actionIndex: { type: integer, minimum: 1, maximum: 256 }
        actionType: { $ref: '#/components/schemas/ObjectLocationActionType' }
        objectId:
          type: string
          minLength: 1
          maxLength: 48
        targetCellIndex:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
        timestampMs:
          type: integer
          format: int64
          minimum: 0

    ObjectLocationLevelMetric:
      type: object
      description: >
        Mesure brute d'un niveau. La pratique est l'index 0 avec 2 objets ; les
        tests 1–6 utilisent respectivement 3–8 objets. Les objets et cellules
        d'origine ne figurent jamais dans le payload.
      required:
        - phase
        - levelIndex
        - objectCount
        - actualEncodingDurationMs
        - actualRetentionDurationMs
        - actualRecallDurationMs
        - timedOut
        - completed
        - actions
      properties:
        phase: { $ref: '#/components/schemas/ObjectLocationPhase' }
        levelIndex: { type: integer, minimum: 0, maximum: 6 }
        objectCount: { type: integer, minimum: 2, maximum: 8 }
        actualEncodingDurationMs: { type: integer, minimum: 0, maximum: 12250 }
        actualRetentionDurationMs: { type: integer, minimum: 0, maximum: 2250 }
        actualRecallDurationMs:
          type: integer
          minimum: 0
          maximum: 32250
        timedOut: { type: boolean }
        completed: { type: boolean }
        actions:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/ObjectLocationPlacementAction' }

    ObjectLocationMetrics:
      type: object
      description: >
        Trace brute de « Je place ». Le serveur dérive la graine de
        sessionId|OBJECT_LOCATION_FINE_V1 avec FNV-1a 32 bits puis xorshift32,
        reconstruit les layouts et rejoue les actions. Le score, les positions
        d'origine et les catégories d'erreur ne sont jamais acceptés du client.
      required:
        - protocolVersion
        - completionReason
        - objectLocationLevels
        - sessionCompleted
        - interrupted
        - backgroundEventCount
        - focusLossCount
        - orientationChangeCount
        - droppedFrameCount
      properties:
        protocolVersion: { $ref: '#/components/schemas/ObjectLocationProtocolVersion' }
        completionReason: { $ref: '#/components/schemas/ObjectLocationCompletionReason' }
        objectLocationLevels:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/ObjectLocationLevelMetric' }
        sessionCompleted: { type: boolean }
        interrupted: { type: boolean }
        backgroundEventCount: { type: integer, minimum: 0 }
        focusLossCount: { type: integer, minimum: 0 }
        orientationChangeCount: { type: integer, minimum: 0 }
        droppedFrameCount:
          type: integer
          minimum: 0
          description: Descriptif uniquement ; n'entre jamais dans le score.

    ObjectLocationLevelIndicators:
      type: object
      required:
        - phase
        - levelIndex
        - objectCount
        - completed
        - timedOut
        - passed
        - exactCount
        - swapCount
        - localErrorCount
        - globalErrorCount
        - unplacedCount
        - exactAccuracyPercent
        - averageDisplacementCells
        - recallDurationMs
        - actionCount
        - repositionCount
      properties:
        phase: { $ref: '#/components/schemas/ObjectLocationPhase' }
        levelIndex: { type: integer, minimum: 0, maximum: 6 }
        objectCount: { type: integer, minimum: 2, maximum: 8 }
        completed: { type: boolean }
        timedOut: { type: boolean }
        passed: { type: boolean }
        exactCount: { type: integer, minimum: 0 }
        swapCount: { type: integer, minimum: 0 }
        localErrorCount: { type: integer, minimum: 0 }
        globalErrorCount: { type: integer, minimum: 0 }
        unplacedCount: { type: integer, minimum: 0 }
        exactAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        averageDisplacementCells: { type: number, format: double, minimum: 0 }
        recallDurationMs: { type: integer, minimum: 0 }
        actionCount: { type: integer, minimum: 0, maximum: 256 }
        repositionCount: { type: integer, minimum: 0 }
        averageFirstPlacementIntervalMs:
          type: number
          format: double
          nullable: true
          description: Intervalle moyen entre premières poses sur ce niveau.

    ObjectLocationIndicators:
      type: object
      description: >
        Rapport descriptif calculé côté serveur. PROVISOIRE — le score /100 est
        uniquement l'exactitude globale sur les objets des niveaux TEST
        terminés, avec un seul arrondi half-up. Swaps, distances, erreurs,
        pente et temps restent hors score. Aucun diagnostic, percentile ou
        classement. EXACT, SWAP, LOCAL, GLOBAL et omission sont des catégories
        exclusives ; une omission reçoit la distance diagonale maximale mais
        n'est pas comptée comme erreur GLOBAL.
      required:
        - protocolVersion
        - completionReason
        - completed
        - sessionValid
        - technicalValid
        - minimumLevelsValid
        - progressionValid
        - timingValid
        - provisionalAccuracyScore
        - completedLevelCount
        - passedLevelCount
        - administeredObjectCount
        - exactPlacementCount
        - swapCount
        - localErrorCount
        - globalErrorCount
        - unplacedCount
        - exactAccuracyPercent
        - swapRatePercent
        - localErrorRatePercent
        - globalErrorRatePercent
        - averageDisplacementCells
        - span
        - repositionCount
        - backgroundEventCount
        - focusLossCount
        - orientationChangeCount
        - droppedFrameCount
        - timingDeviationCount
        - levels
        - validityIssues
      properties:
        protocolVersion: { $ref: '#/components/schemas/ObjectLocationProtocolVersion' }
        completionReason: { $ref: '#/components/schemas/ObjectLocationCompletionReason' }
        completed: { type: boolean }
        sessionValid: { type: boolean }
        technicalValid: { type: boolean }
        minimumLevelsValid: { type: boolean }
        progressionValid: { type: boolean }
        timingValid: { type: boolean }
        provisionalAccuracyScore: { type: integer, minimum: 0, maximum: 100 }
        completedLevelCount: { type: integer, minimum: 0, maximum: 6 }
        passedLevelCount: { type: integer, minimum: 0, maximum: 6 }
        administeredObjectCount: { type: integer, minimum: 0, maximum: 33 }
        exactPlacementCount: { type: integer, minimum: 0, maximum: 33 }
        swapCount: { type: integer, minimum: 0, maximum: 33 }
        localErrorCount: { type: integer, minimum: 0, maximum: 33 }
        globalErrorCount:
          type: integer
          minimum: 0
          maximum: 33
          description: Objet placé à plus d'une cellule, hors origine d'un autre objet.
        unplacedCount:
          type: integer
          minimum: 0
          maximum: 33
          description: Omission au timeout ; catégorie séparée de GLOBAL.
        exactAccuracyPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        swapRatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
        localErrorRatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
        globalErrorRatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
        averageDisplacementCells: { type: number, format: double, minimum: 0 }
        span: { type: integer, minimum: 0, maximum: 8 }
        loadSlope:
          type: number
          format: double
          nullable: true
          description: Pente OLS exactitude (%) selon la charge ; descriptive.
        averageFirstPlacementIntervalMs:
          type: number
          format: double
          nullable: true
          description: Moyenne des intervalles entre premières poses, hors score.
        repositionCount: { type: integer, minimum: 0 }
        backgroundEventCount: { type: integer, minimum: 0 }
        focusLossCount: { type: integer, minimum: 0 }
        orientationChangeCount: { type: integer, minimum: 0 }
        droppedFrameCount: { type: integer, minimum: 0 }
        timingDeviationCount: { type: integer, minimum: 0 }
        levels:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/ObjectLocationLevelIndicators' }
        validityIssues:
          type: array
          items: { type: string }

    PrevisionPuzzleLevelMetrics:
      type: object
      description: >
        Métriques objectives d'UN niveau de « Predictive Puzzle » (Tour de Hanoï).
        Le serveur applique le barème catégoriel de la fiche puis agrège.
      required: [discCount, firstTrySuccess, sequenceErrors, plannedMoves, retries, completed]
      properties:
        levelIndex: { type: integer, minimum: 0, description: "Index du niveau (0-based)" }
        discCount: { type: integer, minimum: 1, description: "Nombre de disques (optimal = 2^n − 1)" }
        firstTrySuccess:
          type: boolean
          description: "true si le niveau est réussi au 1er run sans retry ni erreur."
        sequenceErrors:
          type: integer
          minimum: 0
          description: "Nombre d'erreurs de séquence sur le niveau."
        plannedMoves:
          type: integer
          minimum: 0
          description: "Nombre de coups planifiés (run final du niveau)."
        optimalMoves:
          type: integer
          minimum: 1
          description: "Optionnel : optimal déterministe 2^discCount − 1 (recalculé serveur si absent)."
        retries:
          type: integer
          minimum: 0
          description: "Nombre de réinitialisations de plan sur le niveau."
        completed:
          type: boolean
          description: "true si la cible du niveau a été atteinte."

    PrevisionPuzzleMetrics:
      type: object
      description: >
        Métriques objectives de « Predictive Puzzle ». Le mini-jeu enchaîne
        plusieurs niveaux (Tour de Hanoï 3/4/5 disques) : envoyer `levels` (une
        entrée par niveau joué). Le serveur note chaque niveau /10 (barème
        catégoriel de la fiche) puis agrège par moyenne arrondie (un seul Attempt).
      required: [levels]
      properties:
        levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PrevisionPuzzleLevelMetrics' }
          description: "Métriques par niveau joué."

    MoveFastSessionEndCondition:
      type: object
      description: >
        Condition de fin de session Move Fast (documentation ; pilotée côté serveur
        par MoveFastConfig.SESSION_END_MODE, non transmise par le client).
        ⚠️ DIVERGENCE ASSUMÉE : le mode par défaut FIXED_BUDGET (12/18/84 s) diverge
        de la fiche, qui prescrit REACH_MAX_MULTIPLIER (aucune limite). Basculer =
        changer une constante (backend + miroir mobile), en attente du psychologue.
      properties:
        mode:
          type: string
          enum: [FIXED_BUDGET, REACH_MAX_MULTIPLIER]
          default: FIXED_BUDGET
          description: "Mode de fin de session. FIXED_BUDGET = comportement produit ; REACH_MAX_MULTIPLIER = fiche."
        targetCorrectAnswers: { type: integer, example: 12, description: "Mode FIXED_BUDGET uniquement." }
        maxResponses: { type: integer, example: 18, description: "Mode FIXED_BUDGET uniquement (pas de plafond en REACH_MAX_MULTIPLIER)." }
        sessionSeconds: { type: integer, example: 84, description: "Mode FIXED_BUDGET uniquement." }

    MoveFastIndicators:
      type: object
      description: >
        Indicateurs de flexibilité cognitive « Je bouge », CALCULÉS PAR LE SERVEUR
        à partir des essais notés (échauffement exclu). Le client ne les calcule
        jamais. Métrique centrale : switchCostMs (coût de bascule).
      properties:
        precisionRatio: { type: number, format: double, description: "correct / total × 100 (hors pratique)" }
        averageReactionTimeMs: { type: number, format: double }
        medianReactionTimeMs: { type: number, format: double }
        stdDevReactionTimeMs: { type: number, format: double }
        fastResponsesPercent: { type: number, format: double, description: "% réponses < 250 ms" }
        slowResponsesPercent: { type: number, format: double, description: "% réponses > 2000 ms" }
        switchResponseTimeAvgMs: { type: number, format: double, description: "moyenne des essais isSwitchTrial=true" }
        nonSwitchResponseTimeAvgMs: { type: number, format: double, description: "moyenne des essais isSwitchTrial=false" }
        switchCostMs: { type: number, format: double, description: "switch − nonSwitch" }
        perseverativeErrorsCount: { type: integer, description: "erreurs avec appliedOldRule=true" }
        correctResponsesRuleOrientation: { type: integer }
        correctResponsesRuleMovement: { type: integer }
        sessionDurationSec: { type: integer }
        sessionCompletionStatus: { type: string, enum: [completed, abandoned] }
        calibrationApplied: { type: boolean, description: "true si un DeviceCalibration a été fourni." }
        calibrationReliable: { type: boolean, description: "false si fallback profil matériel (fiabilité réduite)." }
        calibrationOffsetMs: { type: number, format: double, description: "Offset appliqué aux temps bruts." }
        averageReactionTimeAdjustedMs: { type: number, format: double, description: "Moyenne RT corrigée (brut − offset)." }
        medianReactionTimeAdjustedMs: { type: number, format: double }
        fastResponsesPercentAdjusted: { type: number, format: double }
        slowResponsesPercentAdjusted: { type: number, format: double }
        switchCostAdjustedMs: { type: number, format: double, description: "Coût de bascule corrigé (l'offset s'annule dans la différence)." }

    PrevisionPuzzleIndicators:
      type: object
      description: >
        Indicateurs qualitatifs « Predictive Puzzle », CALCULÉS PAR LE SERVEUR.
        `globalPlanSuccess` (succès/échec du plan) reste HORS du score /10.
      properties:
        globalPlanSuccess: { type: boolean, description: "true si tous les niveaux joués sont complétés." }
        levelsPlayed: { type: integer }
        levelsCompleted: { type: integer }
        levels:
          type: array
          items:
            type: object
            properties:
              levelIndex: { type: integer }
              discCount: { type: integer }
              score: { type: integer, description: "Score /10 du niveau" }
              completed: { type: boolean }
              firstTrySuccess: { type: boolean }

    ScoreBreakdownLine:
      type: object
      description: >
        Une ligne du DÉTAIL du score (panneau « d'où viennent mes points »),
        calculée serveur à partir des mêmes métriques et du même barème. `kind`
        pilote l'affichage : NOTE (explication), INFO (mesure sans points),
        CRITERION (« label (detail) : points/max »), SUBTOTAL (niveau),
        TOTAL (total/moyenne).
      required: [kind, label]
      properties:
        kind: { type: string, enum: [NOTE, INFO, CRITERION, SUBTOTAL, TOTAL] }
        label: { type: string }
        detail: { type: string, nullable: true, description: "Valeur mesurée / formule (entre parenthèses à l'affichage)." }
        points: { type: integer, nullable: true }
        maxPoints: { type: integer, nullable: true }

    MemoryTaskKind:
      type: string
      description: Type de tâche notée « J'investigue ».
      enum: [SAME_ORDER, REVERSE_ORDER, RESTORE, AFTER_DISTRACTION, DISTRACTION_CHALLENGE]

    MemoryTaskResult:
      type: object
      description: >
        Résultat mesuré d'UNE tâche (une instance de niveau). Le serveur note la
        justesse du rappel (correct/total) et applique le timeout ajusté du
        calibrage : une tâche dont responseTimeMs dépasse (max_task_time_ms +
        offset) est un échec par dépassement (note voidée). Le client n'envoie
        jamais de points.
      required: [kind, correct, total, responseTimeMs]
      properties:
        kind: { $ref: '#/components/schemas/MemoryTaskKind' }
        correct: { type: integer, minimum: 0, description: "Éléments rappelés correctement" }
        total: { type: integer, minimum: 0, description: "Éléments à rappeler" }
        responseTimeMs: { type: integer, minimum: 0, description: "Temps brut de la tâche (timeout appliqué serveur)" }
        level:
          type: integer
          minimum: 1
          default: 1
          description: >
            Niveau d'origine de la tâche. Fixe le délai applicable à une tâche
            DISTRACTION_CHALLENGE, dont le budget dépend du niveau, alors que les
            tâches de rappel partagent un seuil unique.

    MemoryQuestMetrics:
      type: object
      description: >
        Mesures brutes de « J'investigue » (mémoire de travail). Le serveur note
        chaque tâche 0–5 (rappel même ordre/inverse, restauration d'objets, rappel
        après distraction) puis calcule le composite /100 (indicatif). La Mission B
        est jouée si objectCount > 0 ; la distraction si distractionPlayed.
        Le score dépend du TEMPS via le timeout par tâche (calibrage appareil) :
        envoyer `tasks` (par instance) permet l'ajustement. Sans `tasks`, le
        composite est calculé sur les agrégats plats (compatibilité, sans timeout).
        Le champ `memoryQuestMode` dit quelle moitié du jeu a été jouée : le jeu a
        été scindé en deux mini-jeux (chiffres / images). Une partie IMAGES
        n'observe aucun chiffre et ne joue aucune restitution inversée — ses
        mesures de chiffres doivent rester à 0 et `objectCount` être > 0.
      required: []
      properties:
        memoryQuestMode:
          type: string
          enum: [DIGITS, IMAGES, FULL]
          default: FULL
          description: "Moitié jouée. Absent = FULL (clients antérieurs à la scission)."
        distractionChallengesPlayed:
          type: integer
          minimum: 0
          description: "Tâches parasites visuelles présentées (intrus / pièce manquante)."
        distractionChallengesSolved:
          type: integer
          minimum: 0
          description: "Tâches parasites résolues dans les temps."
        distractionTimeouts:
          type: integer
          minimum: 0
          description: "Tâches parasites perdues par expiration du chronomètre."
        observedDigits: { type: integer, minimum: 0, description: "Chiffres observés (Mission A ; requis si le mode joue les chiffres)" }
        correctSameDigits: { type: integer, minimum: 0, description: "Chiffres corrects, rappel même ordre" }
        correctReverseDigits: { type: integer, minimum: 0, description: "Chiffres corrects, rappel inverse" }
        highestSequenceLength: { type: integer, minimum: 0, description: "Empan maximal atteint" }
        objectCount: { type: integer, minimum: 0, description: "Nb d'objets (Mission B ; 0 si non jouée)" }
        restoreCorrect: { type: integer, minimum: 0, description: "Positions correctes à la restauration" }
        manipulationCount: { type: integer, minimum: 0, description: "Manipulations automatiques observées" }
        distractionPlayed: { type: boolean, description: "true si la phase de distraction a été jouée" }
        afterDistractionObserved: { type: integer, minimum: 0, description: "Chiffres à protéger (distraction)" }
        afterDistractionCorrect: { type: integer, minimum: 0, description: "Chiffres corrects après distraction" }
        distractionQuestionCorrect: { type: boolean, description: "Réponse à la question rapide correcte (indicateur)" }
        finalLevel: { type: integer, minimum: 1, default: 1, description: "Niveau atteint (1–7)" }
        sessionCompleted: { type: boolean, default: true, description: "false = abandon avant la condition de fin" }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/MemoryTaskResult' }
          description: "Tâches par instance (avec timing) — active l'ajustement timeout du calibrage."

    MemoryQuestIndicators:
      type: object
      description: >
        Indicateurs « J'investigue » CALCULÉS PAR LE SERVEUR : notes par tâche
        (0–5) + composite /100 (indicatif, non diagnostique) + niveau atteint et
        validité de session. Tâches optionnelles nulles si non jouées.
      properties:
        compositeScore: { type: integer, description: "Composite /100" }
        sameOrderScore: { type: integer }
        reverseOrderScore: { type: integer }
        restoreScore: { type: integer, nullable: true }
        afterDistractionScore: { type: integer, nullable: true }
        highestSequenceLength: { type: integer }
        distractionQuestionCorrect: { type: boolean }
        missionBPlayed: { type: boolean }
        distractionPlayed: { type: boolean }
        finalLevel: { type: integer, description: "Niveau atteint (1–7)" }
        sessionValid: { type: boolean, description: "false si appareil peu fiable / abandon / trop de timeouts" }
        timeoutTaskCount: { type: integer, description: "Tâches en échec par dépassement de temps (timeout ajusté)" }

    DecisionDimension:
      type: string
      description: >
        Dimension cognitive de « Je Décide » (fiche « JE DÉCIDE ») : 5 capacités,
        6 items chacune, /18 par dimension. DT est la seule dont le score dépend du temps.
      enum: [II, ER, DT, CS, RE]

    AdministrationMode:
      type: string
      description: >
        Mode de passation. En UNSUPERVISED, les contrôles de plausibilité des temps
        sont renforcés (couche provisoire).
      enum: [SUPERVISED, UNSUPERVISED]

    DecisionItemList:
      type: object
      description: >
        Forme de passation servie au client. ⚠️ Aucun champ de ce schéma, ni d'aucun
        schéma qu'il référence, ne porte de qualité d'option, de score ou de réponse
        attendue — un test de sérialisation le vérifie côté serveur.
      required: [formCode, items, itemsPerDimension]
      properties:
        formCode:
          type: string
          enum: [A, B, C, D]
          description: >
            Forme assignée à la session. Informatif : la notation relit toujours la
            forme portée par la session, jamais une valeur renvoyée par le client.
        itemsPerDimension:
          type: integer
          description: "Items par dimension dans cette forme (6)."
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DecisionItemView' }
          description: "Items dans l'ordre de passation."

    DecisionItemView:
      type: object
      description: "Un item prêt à afficher, expurgé de toute clé de correction."
      required: [itemId, dimension, format, vignette, task, options]
      properties:
        itemId: { type: string, description: "Clé de l'item (II-1, DT-7, CS-1a…)." }
        dimension: { $ref: '#/components/schemas/DecisionDimension' }
        format: { $ref: '#/components/schemas/DecisionItemFormat' }
        pairId:
          type: string
          nullable: true
          description: >
            Identifiant de paire pour les items COHERENCE_PAIR (CS-1a et CS-1b
            partagent « CS-1 »). Les deux membres d'une paire sont toujours servis
            ensemble — le cadrage gain/perte n'a aucun sens séparé.
        vignette:
          type: string
          description: >
            Situation à lire. Déjà résolue : les items TEMPORAL_DECISION n'ont pas de
            vignette propre et réutilisent celle de leur homologue II, le serveur suit
            la référence.
        task: { type: string, description: "Consigne affichée sous la vignette." }
        timeLimitMs:
          type: integer
          nullable: true
          description: >
            Temps imparti, présent uniquement pour TEMPORAL_DECISION. Vaut
            `dt_time_limit_base_s × multiplicateur de langue`. ⚠️ N'inclut PAS
            `calibrationOffsetMs`, que le serveur ne connaît qu'à la soumission (il
            se déduit de la télémétrie appareil) : le seuil de notation est donc
            très légèrement plus permissif que le chronomètre affiché.
        options:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/DecisionOptionView' }

    DecisionOptionView:
      type: object
      description: "Option proposée. Ne porte ni qualité, ni score, ni marqueur de justesse."
      required: [optionId, label]
      properties:
        optionId: { type: string, description: "Clé renvoyée dans DecisionItemResponse." }
        label: { type: string, description: "Énoncé affiché." }

    DecisionItemFormat:
      type: string
      description: >
        Format d'un item, qui détermine la règle de notation serveur. STANDARD →
        qualité de l'option ; TEMPORAL_DECISION → qualité + rapidité ;
        COHERENCE_PAIR → items appariés (modèle de cohérence non encore implémenté).
      enum: [STANDARD, TEMPORAL_DECISION, COHERENCE_PAIR]

    DecisionItemResponse:
      type: object
      description: >
        Réponse mesurée à UN item « Je Décide ». Le client envoie l'option choisie
        et le temps — jamais de qualité ni de points : la QUALITÉ de l'option (donc
        les points /3) est décidée serveur via le catalogue de scénarios.
      required: [itemId, dimension, responseTimeMs]
      properties:
        itemId: { type: string, description: "Clé de l'item dans le catalogue serveur." }
        dimension: { $ref: '#/components/schemas/DecisionDimension' }
        selectedOptionId: { type: string, nullable: true, description: "Option choisie (absent si non répondu)." }
        responseTimeMs: { type: integer, minimum: 0, description: "Temps de réponse brut (ms)." }
        answered: { type: boolean, default: true, description: "false → item manquant (imputation par dimension)." }
        decisionChangesCount: { type: integer, minimum: 0, default: 0, description: "Changements d'avis avant validation (indicateur)." }

    DecisionMetrics:
      type: object
      description: >
        Mesures brutes de « Je Décide » (prise de décision). Le serveur note chaque
        item /3 via le catalogue (qualité de l'option), agrège /18 → /90, puis
        standardise en SCW /100 (poids provisoires). La règle DT (temps) et le
        calibrage appareil affectent la note des items DT. Le client n'envoie jamais
        de points. ⚠️ Les échelles post-test (age/educationLevel/fatigue/motivation)
        ne sont pas précisées par la fiche — transmises telles quelles, à tracer.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DecisionItemResponse' }
          description: "Réponses par item (répondus + non répondus)."
        sessionLanguage: { type: string, description: "Code langue (multiplicateur DT ; en/fr/de fournis, es/it/pt provisoires, ar → fallback)." }
        formCode:
          type: string
          enum: [A, B, C, D]
          readOnly: true
          description: >
            Forme de passation. ⚠️ Écho de diagnostic UNIQUEMENT : la notation relit
            toujours la forme persistée sur la session. Une valeur envoyée par le
            client est ignorée — c'est ce qui empêche de choisir sa propre forme.
        administrationMode:
          allOf: [ { $ref: '#/components/schemas/AdministrationMode' } ]
          default: SUPERVISED
        age: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        educationLevel: { type: string, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        fatigue: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }
        motivation: { type: integer, minimum: 0, nullable: true, description: "Post-test (⚠️ échelle à préciser)." }

    DecisionIndicators:
      type: object
      description: >
        Indicateurs « Je Décide » CALCULÉS PAR LE SERVEUR : détail par dimension
        (/18) + brut (/90) + SCW (/100) + niveau, interprétations automatiques
        (textes fiche, seuils provisoires), qualité de session et indicateurs
        temporels. SCW, niveau et seuils viennent de la couche provisoire.
      properties:
        rawScore: { type: integer, description: "Somme des dimensions exploitables /90" }
        rawMax: { type: integer, example: 90 }
        scwScore: { type: integer, description: "Score composite standardisé pondéré /100" }
        level: { type: string, description: "Élevé (≥75, fiche) · Normal · Borderline · Fragile (provisoires)" }
        dimensions:
          type: array
          items:
            type: object
            properties:
              dimension: { $ref: '#/components/schemas/DecisionDimension' }
              score: { type: integer, nullable: true, description: "/18 (null si bloc non exploitable)" }
              maxScore: { type: integer, example: 18 }
              exploitable: { type: boolean, description: "false si > 2 items manquants" }
              answeredItems: { type: integer }
              provisionalScoring:
                type: boolean
                description: >
                  true → tous les items servis sur cette dimension sont en notation
                  NEUTRE provisoire : le score ne discrimine pas encore. Concerne CS
                  et RE (modèles de cohérence de paire et d'actualisation hyperbolique
                  non implémentés) et une partie de ER. Exposé pour savoir quoi
                  recalculer le jour où le modèle définitif arrive.
        interpretations:
          type: array
          items: { type: string }
          description: "Interprétations automatiques déclenchées (textes fiche)."
        avgTimePlausible: { type: boolean }
        randomResponseRateOk: { type: boolean }
        impulsiveRateOk: { type: boolean }
        deviceLatencyWithinNorm: { type: boolean }
        sessionUsable: { type: boolean, description: "Verdict global de qualité de session." }
        averageResponseTimeMs: { type: number, format: double }
        medianResponseTimeMs: { type: number, format: double }
        stdDevResponseTimeMs: { type: number, format: double }
        impulsiveResponsePercent: { type: number, format: double, description: "% réponses sous le plancher (10 s)" }
        slowResponsePercent: { type: number, format: double, description: "% réponses au-delà du plafond (30 s)" }
        intraSessionVariability: { type: number, format: double, description: "Coefficient de variation des temps" }
        decisionChangesCount: { type: integer }
        averageResponseTimeAdjustedMs: { type: number, format: double, description: "Moyenne corrigée du calibrage (brut − offset)" }
        dtScoreCalibrationAdjusted: { type: boolean, description: "true si le temps imparti DT a intégré l'offset de calibrage" }
        calibrationApplied: { type: boolean }
        calibrationReliable: { type: boolean }
        calibrationOffsetMs: { type: number, format: double }

    TaskSchedulingMetrics:
      type: object
      description: >
        Métriques objectives du mini-jeu « Ordonnancement de tâches » (Planifik #2).
        Le serveur applique le barème /10 : dépendances (tout-ou-rien) + contraintes
        horaires (tout-ou-rien) + cohérence (0–2) + réajustements (score dérivé du
        nombre brut). Le client n'envoie jamais de points.
      required: [dependenciesRespected, timeConstraintsRespected, planningCoherence, adjustmentCount]
      properties:
        dependenciesRespected:
          type: boolean
          description: "Toutes les dépendances entre tâches respectées (tout-ou-rien → 3 pts / 0)."
        timeConstraintsRespected:
          type: boolean
          description: "Toutes les contraintes horaires respectées (tout-ou-rien → 3 pts / 0)."
        planningCoherence:
          type: integer
          minimum: 0
          maximum: 2
          description: "0 désordonné · 1 partiellement logique · 2 clair et structuré (0–2 pts)."
        adjustmentCount:
          type: integer
          minimum: 0
          description: "Nombre BRUT de réajustements ; score dérivé serveur (<2→2 · 2-4→1 · >4→0)."

    BasicEmotion:
      type: string
      description: Famille d'émotion de base (étape 1 d'Emotional Radar).
      enum: [JOY, SADNESS, ANGER, FEAR, DISGUST, SURPRISE]

    SceneMediaType:
      type: string
      description: >
        Support de la scène. IMAGE et VIDEO exigent un altText ; VIDEO exige en plus
        un transcript (planche « Accessibility Compliance »).
      enum: [DIALOGUE, TEXT, IMAGE, VIDEO]

    EmotionalRadarNuance:
      type: object
      description: Nuance proposée pour une famille d'émotion.
      properties:
        key: { type: string, example: DISAPPOINTMENT }
        label: { type: string, example: Disappointment }
        source:
          type: string
          enum: [FIGMA, PROVISIONAL]
          description: >
            PROVISIONAL = sous-catégorie Ekman ajoutée faute de taxonomie fournie,
            isolée dans EmotionalRadarProvisionalRules. À valider par le psychologue.

    EmotionalRadarScene:
      type: object
      description: >
        Scène telle que servie au client. Ne contient JAMAIS la réponse attendue
        ni l'explication : la correction est faite serveur (anti-triche).
      properties:
        id: { type: string, format: uuid }
        sceneOrder: { type: integer, example: 1 }
        mediaType: { $ref: '#/components/schemas/SceneMediaType' }
        promptText:
          type: string
          # NB : exemple volontairement sans guillemets droits — openapi-generator
          # 7.5.0 les ré-échappe mal dans les exemples générés (`\\"` → Java invalide).
          example: 'Friend: I am sorry, I have to cancel tonight.'
        instructionText:
          type: string
          example: Observe the situation, then identify the emotional pattern.
        mediaUrl: { type: string, nullable: true }
        altText:
          type: string
          nullable: true
          description: Équivalent textuel — obligatoire pour IMAGE et VIDEO.
        transcript:
          type: string
          nullable: true
          description: Transcription/sous-titres — obligatoire pour VIDEO.

    EmotionalRadarSceneList:
      type: object
      properties:
        totalScenes:
          type: integer
          description: Nombre de scènes de la session (3 aujourd'hui, 15 à terme).
          example: 3
        maxPoints:
          type: integer
          description: totalScenes × 9.
          example: 27
        emotions:
          type: array
          description: Les 6 familles et leurs nuances sélectionnables.
          items:
            type: object
            properties:
              emotion: { $ref: '#/components/schemas/BasicEmotion' }
              nuances:
                type: array
                items: { $ref: '#/components/schemas/EmotionalRadarNuance' }
        scenes:
          type: array
          items: { $ref: '#/components/schemas/EmotionalRadarScene' }

    EmotionalRadarAnswerRequest:
      type: object
      required: [selectedEmotion, selectedNuance, selectedIntensity]
      properties:
        selectedEmotion: { $ref: '#/components/schemas/BasicEmotion' }
        selectedNuance: { type: string, example: DISAPPOINTMENT }
        selectedIntensity: { type: integer, minimum: 1, maximum: 5, example: 3 }

    EmotionalRadarFeedback:
      type: object
      description: >
        Correction d'UNE scène, calculée et persistée serveur. C'est le seul moment
        où la réponse attendue est divulguée — jamais avant validation.
      properties:
        correct: { type: boolean }
        expectedEmotion: { $ref: '#/components/schemas/BasicEmotion' }
        expectedNuance: { type: string, example: DISAPPOINTMENT }
        suggestedIntensity: { type: integer, example: 3 }
        explanation:
          type: string
          example: Disappointment belongs to the sadness family because the situation involves an unmet expectation.
        emotionPoints: { type: integer, example: 3 }
        nuancePoints: { type: integer, example: 4 }
        intensityPoints: { type: integer, example: 2 }
        scenePoints: { type: integer, example: 9 }
        totalPoints:
          type: integer
          description: Cumul des scènes déjà notées dans la session.
          example: 9
        answeredScenes: { type: integer, example: 1 }

    EmotionalRadarSceneMetric:
      type: object
      description: >
        Mesures COMPORTEMENTALES d'une scène. Ne contient ni réponse ni points —
        ceux-ci proviennent des réponses notées et persistées par le serveur.
      required: [sceneId, responseTimeMs]
      properties:
        sceneId: { type: string, format: uuid }
        responseTimeMs: { type: integer, minimum: 0 }
        helpOpened: { type: boolean, default: false }
        fullscreenOpened: { type: boolean, default: false }
        reducedMotion: { type: boolean, default: false }

    EmotionalRadarMetrics:
      type: object
      description: >
        Métriques finales d'Emotional Radar. Volontairement dépourvues de réponses :
        le score est reconstruit depuis les réponses notées serveur, donc un payload
        falsifié ne peut pas le modifier (AGENTS.md §7.4).
      required: [scenes]
      properties:
        scenes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EmotionalRadarSceneMetric' }

    EmotionalRadarIndicators:
      type: object
      description: Indicateurs de reconnaissance émotionnelle dérivés serveur.
      properties:
        scenesPlayed: { type: integer, example: 3 }
        emotionAccuracyPercent:
          type: number
          format: double
          description: Justesse du choix de famille.
          example: 89.0
        nuanceAccuracyPercent:
          type: number
          format: double
          example: 76.0
        intensityCalibrationPercent:
          type: number
          format: double
          description: Qualité de calibrage de l'intensité.
          example: 81.0
        averageResponseTimeMs: { type: integer, example: 8400 }
        helpOpenedCount: { type: integer, example: 1 }
        confusedEmotions:
          type: array
          description: Familles confondues (attendue → choisie).
          items:
            type: object
            properties:
              expected: { $ref: '#/components/schemas/BasicEmotion' }
              selected: { $ref: '#/components/schemas/BasicEmotion' }

    ReflectivePauseResponseType:
      type: string
      description: >
        Réponse choisie face à un moment de pression. Le client transmet le type
        choisi, jamais sa qualité ni des points.
      enum:
        - RESPOND_IMPULSIVELY
        - BREATHE_ANALYZE
        - WAIT
        - ASK_FOR_MORE_INFORMATION
        - REFORMULATE_CALMLY

    ReflectivePauseMomentMetric:
      type: object
      description: >
        Mesures brutes d'un moment de pression. Le serveur vérifie le timer
        minimum et dérive les trois sous-scores.
      required: [momentId, selectedResponse, responseTimeMs, minimumTimerReached]
      properties:
        momentId:
          type: string
          description: Identifiant stable du catalogue de 10 moments.
          example: PRESSURE_01
        selectedResponse: { $ref: '#/components/schemas/ReflectivePauseResponseType' }
        responseTimeMs:
          type: integer
          minimum: 0
          description: Temps entre l'affichage du moment et la validation.
        minimumTimerReached:
          type: boolean
          description: >
            Doit être cohérent avec responseTimeMs >= 3000 ; le domaine rejette
            toute incohérence.

    ReflectivePauseMetrics:
      type: object
      description: >
        Métriques objectives de Reflective Pause. Les 10 moments sont obligatoires,
        uniques et connus du catalogue serveur. Aucun score n'est accepté du client.
      required: [reflectivePauseMoments]
      properties:
        reflectivePauseMoments:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/ReflectivePauseMomentMetric' }

    ReflectivePauseIndicators:
      type: object
      description: Indicateurs Reflective Pause dérivés côté serveur.
      required:
        - momentsPlayed
        - controlledReactionTimeScore
        - nonImpulsiveResponsesScore
        - abilityToStepBackScore
        - impulsiveChoiceCount
        - averageResponseTimeMs
        - level
      properties:
        momentsPlayed: { type: integer, example: 10 }
        controlledReactionTimeScore:
          type: number
          format: double
          minimum: 0
          maximum: 3
          example: 2.4
        nonImpulsiveResponsesScore:
          type: number
          format: double
          minimum: 0
          maximum: 4
          example: 3.6
        abilityToStepBackScore:
          type: number
          format: double
          minimum: 0
          maximum: 3
          example: 2.1
        impulsiveChoiceCount: { type: integer, example: 1 }
        averageResponseTimeMs: { type: integer, example: 5400 }
        level:
          type: string
          example: Very good self-control

    GameMetrics:
      # NB : membres en $ref nus (source de vérité = SubmitResultRequest.toMetrics côté
      # code, la génération games n'étant pas consommée par les contrôleurs, écrits à la
      # main). À 6 membres exactement, openapi-generator 7.5.0 loguait une NPE NON FATALE
      # dans processSimplifyOneOf (TreeSet du type de chaque membre, null pour un $ref) —
      # le 7e membre (EmotionalRadarMetrics) sort de ce cas particulier. Ne PAS encapsuler
      # en { type: object, allOf: [ $ref ] } : cela dédouble les champs du DTO (échec compile).
      oneOf:
        - $ref: '#/components/schemas/OptimalPathMetrics'
        - $ref: '#/components/schemas/TaskSchedulingMetrics'
        - $ref: '#/components/schemas/MoveFastMetrics'
        - $ref: '#/components/schemas/PrevisionPuzzleMetrics'
        - $ref: '#/components/schemas/MemoryQuestMetrics'
        - $ref: '#/components/schemas/DecisionMetrics'
        - $ref: '#/components/schemas/EmotionalRadarMetrics'
        - $ref: '#/components/schemas/ReflectivePauseMetrics'
        - $ref: '#/components/schemas/ContinuousAttentionMetrics'
        - $ref: '#/components/schemas/CoordinationMetrics'
        - $ref: '#/components/schemas/ObjectLocationMetrics'

    SubmitResultRequest:
      type: object
      required: [miniGame, metrics]
      properties:
        miniGame: { $ref: '#/components/schemas/MiniGame' }
        metrics: { $ref: '#/components/schemas/GameMetrics' }
        deviceCalibration:
          allOf: [ { $ref: '#/components/schemas/DeviceCalibration' } ]
          nullable: true
          description: "Optionnel (n'existe pas chez les anciens clients). Socle de calibrage appareil."

    Score:
      type: object
      properties:
        rawPoints: { type: integer, example: 8 }
        maxPoints: { type: integer, example: 10 }
        normalized: { type: number, format: double, example: 80.0 }
        level: { type: string, example: "Bon à excellent" }

    Attempt:
      type: object
      properties:
        miniGame: { $ref: '#/components/schemas/MiniGame' }
        score: { $ref: '#/components/schemas/Score' }
        recordedAt: { type: string, format: date-time }

    GameSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        gameType: { $ref: '#/components/schemas/GameType' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        compositeRaw: { type: integer, example: 24 }
        compositeMax: { type: integer, example: 30 }
        normalized: { type: number, format: double, example: 80.0 }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        moveFastIndicators:
          allOf: [ { $ref: '#/components/schemas/MoveFastIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Move Fast."
        previsionPuzzleIndicators:
          allOf: [ { $ref: '#/components/schemas/PrevisionPuzzleIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Predictive Puzzle."
        memoryQuestIndicators:
          allOf: [ { $ref: '#/components/schemas/MemoryQuestIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne « J'investigue »."
        decisionIndicators:
          allOf: [ { $ref: '#/components/schemas/DecisionIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne « Je Décide »."
        emotionalRadarIndicators:
          allOf: [ { $ref: '#/components/schemas/EmotionalRadarIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Emotional Radar."
        reflectivePauseIndicators:
          allOf: [ { $ref: '#/components/schemas/ReflectivePauseIndicators' } ]
          nullable: true
          description: "Présent uniquement quand le résultat soumis concerne Reflective Pause."
        continuousAttentionIndicators:
          allOf: [ { $ref: '#/components/schemas/ContinuousAttentionIndicators' } ]
          nullable: true
          description: >
            Présent uniquement après « Je continue ». Rapport descriptif Rosvold
            X/AX ; aucune norme ou interprétation Conners CPT-3.
        coordinationIndicators:
          allOf: [ { $ref: '#/components/schemas/CoordinationIndicators' } ]
          nullable: true
          description: >
            Présent uniquement après « Je coordonne ». Toutes les précisions et
            distances sont reconstruites côté serveur depuis la trace brute.
        objectLocationIndicators:
