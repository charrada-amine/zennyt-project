openapi: 3.0.3
info:
  title: Zennyt - Identity API
  description: >
    Identity bounded context: local, Google, and Apple authentication, JWT lifecycle,
    candidate/student and recruiter onboarding, and professional profiles.
  version: 2.0.0

servers:
  - url: https://api.zennyt.com/api/v1
    description: Production
  - url: https://api-staging.zennyt.com/api/v1
    description: Staging

tags:
  - name: Auth
  - name: Users
  - name: Onboarding
  - name: Profiles

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Create a local account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /auth/social:
    post:
      operationId: postAuthSocial
      tags: [Auth]
      summary: Authenticate with a Google or Apple ID token
      description: >
        Validates the provider ID token and exchanges it for a Zennyt access and
        refresh token pair. Role, terms acceptance, and usable names are required
        only when the provider identity creates a new account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Auth]
      summary: Rotate a refresh token and issue a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Token pair rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Refresh token revoked }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /auth/change-password:
    post:
      operationId: postAuthChangePassword
      tags: [Auth]
      summary: Change the password of the authenticated account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [Auth]
      summary: Request a password reset code by email
      description: >-
        Always returns 202 regardless of whether the email exists,
        to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: If the account exists, a reset code has been sent
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [Auth]
      summary: Reset the password using the emailed OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password reset; all sessions revoked }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Get the authenticated account
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /users/me:
    put:
      operationId: putUsersMe
      tags: [Users]
      summary: Update common account fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
    delete:
      operationId: deleteUsersMe
      tags: [Users]
      summary: Delete the current account (soft delete and anonymization)
      responses:
        '204': { description: Account deleted }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /users/me/avatar:
    post:
      operationId: postUsersMeAvatar
      tags: [Users]
      summary: Upload (or replace) the current account avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (PNG, JPEG or WEBP, max 5MB).
      responses:
        '200':
          description: Avatar uploaded; account with profileImageUrl set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      operationId: deleteUsersMeAvatar
      tags: [Users]
      summary: Remove the current account avatar
      responses:
        '200':
          description: Avatar removed; account with profileImageUrl cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /users/me/deactivate:
    post:
      operationId: postUsersMeDeactivate
      tags: [Users]
      summary: Deactivate the current account (reversible at next login)
      responses:
        '204': { description: Account deactivated }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }

  /users/me/role:
    patch:
      operationId: patchUsersMeRole
      tags: [Users]
      summary: Change the account role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }

  /onboarding/candidate-student:
    post:
      operationId: postOnboardingCandidateStudent
      tags: [Onboarding]
      summary: Create candidate or student onboarding information
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateStudentOnboardingInput' }
      responses:
        '201':
          description: Onboarding created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateStudentOnboarding' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }

  /onboarding/candidate-student/me:
    get:
      operationId: getOnboardingCandidateStudentMe
      tags: [Onboarding]
      summary: Get current candidate or student onboarding information
      responses:
        '200':
          description: Current onboarding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateStudentOnboarding' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      operationId: putOnboardingCandidateStudentMe
      tags: [Onboarding]
      summary: Update current candidate or student onboarding information
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateStudentOnboardingInput' }
      responses:
        '200':
          description: Onboarding updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateStudentOnboarding' }

  /onboarding/recruiter:
    post:
      operationId: postOnboardingRecruiter
      tags: [Onboarding]
      summary: Create recruiter onboarding information
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecruiterOnboardingInput' }
      responses:
        '201':
          description: Onboarding created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterOnboarding' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }

  /onboarding/recruiter/me:
    get:
      operationId: getOnboardingRecruiterMe
      tags: [Onboarding]
      summary: Get current recruiter onboarding information
      responses:
        '200':
          description: Current onboarding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterOnboarding' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      operationId: putOnboardingRecruiterMe
      tags: [Onboarding]
      summary: Update current recruiter onboarding information
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecruiterOnboardingInput' }
      responses:
        '200':
          description: Onboarding updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterOnboarding' }

  /onboarding/recruiter/me/logo:
    post:
      operationId: postOnboardingRecruiterMeLogo
      tags: [Onboarding]
      summary: Upload (or replace) the company logo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (PNG, JPEG or WEBP, max 5MB).
      responses:
        '200':
          description: Logo uploaded; onboarding with companyLogoUrl set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterOnboarding' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      operationId: deleteOnboardingRecruiterMeLogo
      tags: [Onboarding]
      summary: Remove the company logo
      responses:
        '200':
          description: Logo removed; onboarding with companyLogoUrl cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterOnboarding' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /onboarding/company/{recruiterId}:
    get:
      operationId: getCompanyByRecruiterId
      tags: [Onboarding]
      summary: Get all company informations by recruiter id
      parameters:
        - name: recruiterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Company informations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /profiles:
    post:
      operationId: postProfiles
      tags: [Profiles]
      summary: Create the current candidate or student profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }

  /profiles/me:
    get:
      operationId: getProfilesMe
      tags: [Profiles]
      summary: Get the current professional profile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      operationId: putProfilesMe
      tags: [Profiles]
      summary: Update the current professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /profiles/me/cv:
    post:
      operationId: postProfilesMeCv
      tags: [Profiles]
      summary: Upload (or replace) the current profile's CV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CV file (PDF, DOC or DOCX, max 5MB).
      responses:
        '200':
          description: CV uploaded; profile with cvUrl set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      operationId: deleteProfilesMeCv
      tags: [Profiles]
      summary: Remove the current profile's CV
      responses:
        '200':
          description: CV removed; profile with cvUrl cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /profiles/me/cv/parse:
    post:
      operationId: postProfilesMeCvParse
      tags: [Profiles]
      summary: Extract structured profile data from CV text using AI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CvParseRequest' }
      responses:
        '200':
          description: Parsed profile data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvParseResult' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '429':
          description: AI provider quota or rate limit reached
        '503':
          description: CV parsing provider is not configured or temporarily unavailable

  /profiles/{profileId}:
    get:
      operationId: getProfilesByProfileid
      tags: [Profiles]
      summary: Get a professional profile by ID
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }

  /profiles/me/skills:
    get:
      operationId: getProfilesMeSkills
      tags: [Profiles]
      summary: List skills, optionally filtered by type
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/SkillType' }
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
    post:
      operationId: postProfilesMeSkills
      tags: [Profiles]
      summary: Add a skill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '201':
          description: Skill added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }

  /profiles/me/skills/{id}:
    put:
      operationId: putProfilesMeSkillsById
      tags: [Profiles]
      summary: Update a skill
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillInput' }
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
    delete:
      operationId: deleteProfilesMeSkillsById
      tags: [Profiles]
      summary: Delete a skill
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204': { description: Skill deleted }

  /profiles/me/positions:
    get:
      operationId: getProfilesMePositions
      tags: [Profiles]
      summary: List positions
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
    post:
      operationId: postProfilesMePositions
      tags: [Profiles]
      summary: Add a position
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionInput' }
      responses:
        '201':
          description: Position added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }

  /profiles/me/positions/{id}:
    put:
      operationId: putProfilesMePositionsById
      tags: [Profiles]
      summary: Update a position
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionInput' }
      responses:
        '200':
          description: Position updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
    delete:
      operationId: deleteProfilesMePositionsById
      tags: [Profiles]
      summary: Delete a position
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204': { description: Position deleted }

  /profiles/me/certifications:
    get:
      operationId: getProfilesMeCertifications
      tags: [Profiles]
      summary: List certifications
      responses:
        '200':
          description: Certifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Certification' }
    post:
      operationId: postProfilesMeCertifications
      tags: [Profiles]
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationInput' }
      responses:
        '201':
          description: Certification added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }

  /profiles/me/certifications/{id}:
    put:
      operationId: putProfilesMeCertificationsById
      tags: [Profiles]
      summary: Update a certification
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationInput' }
      responses:
        '200':
          description: Certification updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
    delete:
      operationId: deleteProfilesMeCertificationsById
      tags: [Profiles]
      summary: Delete a certification
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204': { description: Certification deleted }

  /profiles/me/education:
    get:
      operationId: getProfilesMeEducation
      tags: [Profiles]
      summary: List education records
      responses:
        '200':
          description: Education records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Education' }
    post:
      operationId: postProfilesMeEducation
      tags: [Profiles]
      summary: Add an education record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationInput' }
      responses:
        '201':
          description: Education record added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Education' }

  /profiles/me/education/{id}:
    put:
      operationId: putProfilesMeEducationById
      tags: [Profiles]
      summary: Update an education record
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationInput' }
      responses:
        '200':
          description: Education record updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Education' }
    delete:
      operationId: deleteProfilesMeEducationById
      tags: [Profiles]
      summary: Delete an education record
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204': { description: Education record deleted }

components:
  securitySchemes:
    bearerAuth: { $ref: './common.openapi.yaml#/components/securitySchemes/bearerAuth' }

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  schemas:
    Role:
      type: string
      enum: [CANDIDATE, STUDENT, RECRUITER, ADMIN]

    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, role, termsAccepted]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 150 }
        phoneNumber: { type: string, maxLength: 30 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        role:
          type: string
          enum: [CANDIDATE, STUDENT, RECRUITER]
        city: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 255 }
        termsAccepted: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    SocialProvider:
      type: string
      enum: [GOOGLE, APPLE]

    SocialLoginRequest:
      type: object
      required: [provider, idToken]
      properties:
        provider: { $ref: '#/components/schemas/SocialProvider' }
        idToken:
          type: string
          description: ID token issued by Google or Apple for a configured client ID
        firstName:
          type: string
          maxLength: 100
          description: Required for new accounts when absent from provider claims
        lastName:
          type: string
          maxLength: 100
          description: Required for new accounts when absent from provider claims
        role:
          type: string
          enum: [CANDIDATE, STUDENT, RECRUITER]
          description: Required only when creating a new account
        termsAccepted:
          type: boolean
          default: false
          description: Must be true when creating a new account

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 150 }

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 150 }
        code: { type: string, minLength: 4, maxLength: 10, description: OTP code received by email }
        newPassword: { type: string, minLength: 8, maxLength: 72 }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64, example: 900 }

    UserUpdate:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phoneNumber: { type: string, maxLength: 30 }
        city: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 255 }
        # Avatar distant (ex. avatar généré par défaut). Un fichier local doit
        # passer par POST /users/me/avatar ; ce champ permet de fixer un avatar
        # généré (DiceBear) lors de la création de compte côté mobile.
        profileImageUrl: { type: string, maxLength: 500 }

    User:
      allOf:
        - $ref: '#/components/schemas/UserUpdate'
        - type: object
          required: [id, email, role, termsAccepted, emailVerified, active, createdAt, updatedAt]
          properties:
            id: { type: integer, format: int64 }
            email: { type: string, format: email }
            role: { $ref: '#/components/schemas/Role' }
            profileImageUrl: { type: string, maxLength: 500 }
            termsAccepted: { type: boolean }
            emailVerified: { type: boolean }
            active: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    CandidateStudentOnboardingInput:
      type: object
      properties:
        school: { type: string, maxLength: 150 }
        educationLevel: { type: string, maxLength: 150 }
        fieldOfWork: { type: string, maxLength: 150 }
        lastPositionHeld: { type: string, maxLength: 150 }
        yearsOfExperience: { type: integer, minimum: 0 }
        cvFileUrl: { type: string, maxLength: 500 }

    CandidateStudentOnboarding:
      allOf:
        - $ref: '#/components/schemas/CandidateStudentOnboardingInput'
        - $ref: '#/components/schemas/OwnedResource'

    RecruiterOnboardingInput:
      type: object
      required:
        [jobTitle, companyName, companySize, fieldOfWork, companyLocation, companyRegistrationNumber]
      properties:
        jobTitle: { type: string, maxLength: 150 }
        companyName: { type: string, maxLength: 150 }
        companySize: { type: string, maxLength: 100 }
        fieldOfWork: { type: string, maxLength: 150 }
        companyLocation: { type: string, maxLength: 150 }
        companyRegistrationNumber: { type: string, maxLength: 100 }
        aboutMe: { type: string, maxLength: 1000 }
        about: { type: string, maxLength: 5000, description: "Who we are?" }
        mission: { type: string, maxLength: 5000 }
        vision: { type: string, maxLength: 5000 }
        keyDifferentiators: { type: string, maxLength: 5000, description: "What makes us different?" }
        cultureWorkEnvironment: { type: string, maxLength: 5000, description: "Culture & work environment" }
        whyJoinUs: { type: string, maxLength: 5000, description: "Why join us?" }

    RecruiterOnboarding:
      allOf:
        - $ref: '#/components/schemas/RecruiterOnboardingInput'
        - $ref: '#/components/schemas/OwnedResource'
        - type: object
          properties:
            # Le logo est en lecture seule : il se gère via POST/DELETE /onboarding/recruiter/me/logo.
            companyLogoUrl: { type: string, maxLength: 500, readOnly: true }
            missionVision: { type: string, maxLength: 10000, readOnly: true, description: "Combined Mission & Vision" }

    Company:
      type: object
      required: [userId, companyName]
      properties:
        userId: { type: integer, format: int64 }
        companyName: { type: string, maxLength: 150 }
        companyLogoUrl: { type: string, maxLength: 500 }
        about: { type: string, maxLength: 5000 }
        mission: { type: string, maxLength: 5000 }
        vision: { type: string, maxLength: 5000 }
        missionVision: { type: string, maxLength: 10000 }
        keyDifferentiators: { type: string, maxLength: 5000 }
        cultureWorkEnvironment: { type: string, maxLength: 5000 }
        whyJoinUs: { type: string, maxLength: 5000 }
        companySize: { type: string, maxLength: 100 }
        fieldOfWork: { type: string, maxLength: 150 }
        companyLocation: { type: string, maxLength: 150 }

    ProfileInput:
      type: object
      properties:
        currentPosition: { type: string, maxLength: 150 }
        lookingFor: { type: string, maxLength: 150 }
        workplaceType:
          type: string
          enum: [ONSITE, REMOTE, HYBRID, FLEXIBLE]
        jobType:
          type: string
          enum: [FULL_TIME, PART_TIME, INTERNSHIP, FREELANCE, CONTRACT]
        targetJobLocation: { type: string, maxLength: 150 }
        yearsOfExperience: { type: integer, minimum: 0 }
        softSkillsScore: { type: integer, minimum: 0, maximum: 100 }
        aboutMe: { type: string }
        openInternationally: { type: boolean, default: false }
        availabilityType:
          type: string
          enum: [IMMEDIATELY, SELECT_DATE]
        availabilityDate: { type: string, format: date }
        resumeAiUrl: { type: string, maxLength: 500 }
        portfolioUrl: { type: string, maxLength: 500 }

    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - $ref: '#/components/schemas/OwnedResource'
        - type: object
          properties:
            cvUrl:
              type: string
              maxLength: 500
              readOnly: true
              description: URL of the uploaded CV (set via POST /profiles/me/cv).
            skills:
              type: array
              items: { $ref: '#/components/schemas/Skill' }
            positions:
              type: array
              items: { $ref: '#/components/schemas/Position' }
            certifications:
              type: array
              items: { $ref: '#/components/schemas/Certification' }
            education:
              type: array
              items: { $ref: '#/components/schemas/Education' }

    SkillType:
      type: string
      enum: [TECHNICAL, SOFT]

    SkillInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/SkillType' }
        level: { type: integer, minimum: 1, maximum: 5 }

    Skill:
      allOf:
        - $ref: '#/components/schemas/SkillInput'
        - $ref: '#/components/schemas/ProfileItem'

    PositionInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 150 }
        companyName: { type: string, maxLength: 150 }
        location: { type: string, maxLength: 150 }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        current: { type: boolean, default: false }

    Position:
      allOf:
        - $ref: '#/components/schemas/PositionInput'
        - $ref: '#/components/schemas/ProfileItem'

    CertificationInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 150 }
        issuer: { type: string, maxLength: 150 }
        completionDate: { type: string, format: date }
        credentialId: { type: string, maxLength: 150 }
        credentialUrl: { type: string, maxLength: 500 }

    Certification:
      allOf:
        - $ref: '#/components/schemas/CertificationInput'
        - $ref: '#/components/schemas/ProfileItem'

    EducationInput:
      type: object
      required: [degree]
      properties:
        degree: { type: string, maxLength: 150 }
        school: { type: string, maxLength: 150 }
        fieldOfStudy: { type: string, maxLength: 150 }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    Education:
      allOf:
        - $ref: '#/components/schemas/EducationInput'
        - $ref: '#/components/schemas/ProfileItem'

    OwnedResource:
      type: object
      required: [id, userId, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProfileItem:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CvParseRequest:
      type: object
      required: [text, language]
      properties:
        text: { type: string }
        language: { type: string, maxLength: 2 }

    CvParseResult:
      type: object
      properties:
        currentPosition: { type: string }
        aboutMe: { type: string }
        yearsOfExperience: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillInput' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/PositionInput' }
        education:
          type: array
          items: { $ref: '#/components/schemas/EducationInput' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/CertificationInput' }
