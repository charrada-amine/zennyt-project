openapi: 3.0.3
info:
  title: Zennyt — Recruitment API
  description: >
    Contexte délimité Recrutement : offres d'emploi, swipes, matchs,
    évaluations (manuel + IA), candidatures, offres d'opportunité,
    vérification d'identité et paiement visioconférence.
  version: 1.0.0
  contact:
    name: Squad Recrutement

servers:
  - url: https://api.zennyt.com/api/v1
    description: Production
  - url: https://api-staging.zennyt.com/api/v1
    description: Staging

tags:
  - name: JobOffers
    description: Offres d'emploi — cycle de vie et recherche
  - name: JobPositions
    description: Référentiel de métiers (matrice de pondération Fit Score) — sélection position/niveau à la création d'offre
  - name: JobRoleProfiles
    description: Référentiel de pondération Fit Score (profil métier × niveau) — pré-remplissage des curseurs de pondération
  - name: Swipes
    description: Mécanique de swipe bidirectionnelle
  - name: Matches
    description: Matchs mutuels
  - name: FitScores
    description: Scores de compatibilité IA
  - name: Assessments
    description: Banque d'évaluations (création manuelle ou IA)
  - name: TestAttempts
    description: Tentatives de test de compétences (mélange questions/options, timeout/abandon)
  - name: TestResults
    description: Résultats de test de compétences (notation, agrégats recruteur)
  - name: CandidateResume
    description: Résumé IA candidat (soft skills + hard skills)
  - name: JobOpportunityOffers
    description: Offres d'opportunité envoyées par le recruteur
  - name: IdentityVerifications
    description: Vérifications d'identité anti-fraude
  - name: Payments
    description: Paiement des sessions visioconférence
  - name: RecruiterDashboard
    description: Tableau de bord recruteur
  - name: Callbacks
    description: Webhooks entrants des services tiers

security:
  - bearerAuth: []

paths:

  # ═══════════════════════════════════════════════════════════════
  # JOB POSITIONS (référentiel métiers)
  # ═══════════════════════════════════════════════════════════════

  /job-positions:
    get:
      operationId: getJobPositions
      tags: [JobPositions]
      summary: Référentiel approuvé (sélection position -> niveau à la création d'offre)
      parameters:
        - { name: sector, in: query, description: Filtrer par secteur (omis = tous secteurs + transverses), schema: { type: string } }
      responses:
        '200':
          description: Liste des métiers approuvés
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobPosition' }
    post:
      operationId: postJobPositions
      tags: [JobPositions]
      summary: Proposer un métier absent du référentiel (recruteur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                sector: { type: string, nullable: true }
      responses:
        '201':
          description: Métier proposé, en attente d'approbation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-positions/pending:
    get:
      operationId: getJobPositionsPending
      tags: [JobPositions]
      summary: File d'attente d'approbation (admin)
      responses:
        '200':
          description: Métiers en attente d'approbation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-positions/{jobPositionId}/approve:
    parameters:
      - { name: jobPositionId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: patchJobPositionsByJobpositionidApprove
      tags: [JobPositions]
      summary: Approuver un métier proposé (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileType]
              properties:
                profileType: { $ref: '#/components/schemas/JobProfileType' }
      responses:
        '200':
          description: Métier approuvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /job-positions/{jobPositionId}/reject:
    parameters:
      - { name: jobPositionId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: patchJobPositionsByJobpositionidReject
      tags: [JobPositions]
      summary: Rejeter un métier proposé (admin)
      responses:
        '200':
          description: Métier rejeté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ═══════════════════════════════════════════════════════════════
  # JOB ROLE PROFILES (référentiel de pondération Fit Score)
  # ═══════════════════════════════════════════════════════════════

  /job-role-profiles:
    get:
      operationId: getJobRoleProfiles
      tags: [JobRoleProfiles]
      summary: Référentiel de pondération (24 lignes, profil métier × niveau — CdC Fit Score v3 §4.3/§9)
      responses:
        '200':
          description: Les 24 lignes du référentiel
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobRoleProfile' }

  # ═══════════════════════════════════════════════════════════════
  # JOB OFFERS
  # ═══════════════════════════════════════════════════════════════

  /job-offers:
    get:
      operationId: getJobOffers
      tags: [JobOffers]
      summary: Rechercher les offres actives avec filtres
      security: []
      parameters:
        - { name: q, in: query, description: Recherche plein texte sur titre et description, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: contractType, in: query, schema: { $ref: '#/components/schemas/ContractType' } }
        - { name: experienceLevel, in: query, schema: { $ref: '#/components/schemas/ExperienceLevel' } }
        - { name: sort, in: query, description: "Tri au format champ,direction (ex. postedAt,desc)", schema: { type: string } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page d'offres correspondant aux critères (vue résumée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOfferSummaryPage' }

    post:
      operationId: postJobOffers
      tags: [JobOffers]
      summary: Créer une nouvelle offre (recruteur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOfferCreate' }
      responses:
        '201':
          description: Offre créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /recruiters/me/job-offers:
    get:
      operationId: getRecruitersMeJobOffers
      tags: [JobOffers]
      summary: Lister mes offres (recruteur)
      description: Retourne les offres du recruteur connecté avec statistiques (candidateCount, successRate).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobOfferStatus' } }
        - { name: sort, in: query, description: "Tri au format champ,direction (ex. postedAt,desc)", schema: { type: string } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page d'offres du recruteur (vue résumée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOfferSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /recruiters/me/candidate-feed:
    get:
      operationId: getRecruitersMeCandidateFeed
      tags: [FitScores]
      summary: Deck de candidats trié par fit score pour une offre possédée
      parameters:
        - { name: jobOfferId, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Candidats projetés, triés par score et hors paires masquées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateFeedPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-offers/{jobOfferId}:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJobofferid
      tags: [JobOffers]
      summary: Détail public d'une offre active
      security: []
      responses:
        '200':
          description: Détail de l'offre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOffer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putJobOffersByJobofferid
      tags: [JobOffers]
      summary: Remplacement complet d'une offre (recruteur propriétaire)
      description: Même forme que la création. Ne touche ni `status` ni `assessmentId` (voir PATCH).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOfferCreate' }
      responses:
        '200':
          description: Offre remplacée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchJobOffersByJobofferid
      tags: [JobOffers]
      summary: Mise à jour partielle d'une offre (recruteur propriétaire)
      description: >
        Seuls `status` et/ou `assessmentId` sont modifiables ici — tout autre
        champ passe par PUT. Un champ inconnu renvoie 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOfferUpdate' }
      responses:
        '200':
          description: Offre mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteJobOffersByJobofferid
      tags: [JobOffers]
      summary: Supprimer une offre en brouillon (recruteur propriétaire)
      responses:
        '204': { description: Offre supprimée }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /job-offers/{jobOfferId}/status:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    patch:
      operationId: patchJobOffersByJobofferidStatus
      tags: [JobOffers]
      summary: Changer le statut d'une offre (DRAFT/ACTIVE/CLOSED, librement réversible)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/JobOfferStatus' }
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # SWIPES (contrat squad web §5 — l'entité Application n'existe plus ;
  # candidatures/présélection remplacées par le swipe mutuel -> Match)
  # ═══════════════════════════════════════════════════════════════

  /job-offers/matching-deck:
    get:
      operationId: getJobOffersMatchingDeck
      tags: [Swipes]
      summary: Deck d'offres à swiper, pré-trié et pré-filtré (candidat)
      description: >
        Exclut les offres déjà swipées LEFT ou déjà matchées ; priorité aux
        offres où le recruteur a déjà swipé RIGHT sur ce candidat
        (`recruiterAlreadyInterested`, indicateur d'affichage uniquement).
        Seules les offres `ACTIVE` sont éligibles.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Deck de swipe candidat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchingDeckOfferPage' }

  /job-offers/{jobOfferId}/swipes:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    post:
      operationId: postJobOffersByJofferidSwipes
      tags: [Swipes]
      summary: Le candidat swipe sur cette offre
      description: >
        État courant, pas un historique : un swipe déjà actif pour ce candidat
        sur cette offre est un 409 (annuler d'abord). Si le swipe crée un
        match mutuel (le recruteur avait déjà swipé RIGHT), le `match` de la
        réponse est renseigné et un `MatchCreatedEvent` est publié.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwipeCreate' }
      responses:
        '201':
          description: Swipe enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSwipeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: JOB_NOT_ACTIVE, SWIPE_ALREADY_EXISTS ou ALREADY_MATCHED

  /job-offers/{jobOfferId}/swipes/me:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    delete:
      operationId: deleteJobOffersByJofferidSwipesMe
      tags: [Swipes]
      summary: Le candidat annule son swipe sur cette offre (undo)
      description: >
        Si un Match existait pour cette paire, il est supprimé dans la même
        transaction. Le swipe du recruteur n'est jamais touché.
      responses:
        '204': { description: Swipe annulé }
        '404': { description: Aucun swipe actif à annuler }

  /job-offers/{jobOfferId}/candidates/matching-deck:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJofferidCandidatesMatchingDeck
      tags: [Swipes]
      summary: Deck de candidats à swiper pour cette offre (recruteur, propriétaire)
      description: >
        Exclut les candidats déjà swipés LEFT ou déjà matchés pour cette
        offre ; priorité à ceux ayant déjà swipé RIGHT sur cette offre
        (`candidateAlreadyInterested`, indicateur d'affichage uniquement).
        Les champs candidat (`fullName`, `avatarUrl`, `headline`) sont des
        placeholders en attente du contrat Candidate/Profile.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Deck de swipe recruteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchingDeckCandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-offers/{jobOfferId}/candidates/{candidateId}/swipes:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
      - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postJobOffersByJofferidCandidatesByCandidateidSwipes
      tags: [Swipes]
      summary: Le recruteur swipe sur ce candidat pour cette offre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwipeCreate' }
      responses:
        '201':
          description: Swipe enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterSwipeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: JOB_NOT_ACTIVE, SWIPE_ALREADY_EXISTS ou ALREADY_MATCHED

  /job-offers/{jobOfferId}/candidates/{candidateId}/swipes/me:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
      - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteJobOffersByJofferidCandidatesByCandidateidSwipesMe
      tags: [Swipes]
      summary: Le recruteur annule son swipe sur ce candidat (undo)
      responses:
        '204': { description: Swipe annulé }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Aucun swipe actif à annuler }

  # ═══════════════════════════════════════════════════════════════
  # MATCHES
  # ═══════════════════════════════════════════════════════════════

  /candidates/me/matches:
    get:
      operationId: getCandidatesMeMatches
      tags: [Matches]
      summary: Tous les matchs du candidat connecté, toutes offres confondues
      description: >
        Match est binaire (contrat squad web §6.1) — il existe ou n'existe
        pas, pas de statut ni de score. Lecture seule : aucune écriture
        directe n'est exposée, le cycle de vie est un effet de bord du swipe (§5).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page de matchs du candidat connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateMatchPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /job-offers/{jobOfferId}/matches:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJofferidMatches
      tags: [Matches]
      summary: Matchs d'une offre (recruteur, propriétaire)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page de matchs pour cette offre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterMatchPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # FIT SCORES
  # ═══════════════════════════════════════════════════════════════

  /fit-scores:
    get:
      operationId: getFitScores
      tags: [FitScores]
      summary: Score de compatibilité entre le candidat connecté et une offre
      parameters:
        - { name: candidateId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: jobOfferId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Score de compatibilité
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FitScore' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteFitScores
      tags: [FitScores]
      summary: Retirer une paire des Fit Scores du recruteur
      parameters:
        - { name: candidateId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: jobOfferId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Paire masquée pour le recruteur connecté }
        '403': { $ref: '#/components/responses/Forbidden' }

  /fit-scores/recompute:
    post:
      operationId: postFitScoresRecompute
      tags: [FitScores]
      summary: Recalcul synchrone des fit scores (levier démo, recruteur)
      description: >
        Avec jobOfferId : tous les candidats projetés contre cette offre ;
        sans corps : toutes les offres ACTIVE. Le flux normal reste asynchrone
        (offre activée, partie jouée). Tolérant aux échecs par paire.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jobOfferId: { type: string, format: uuid }
      responses:
        '200':
          description: Nombre de paires recalculées
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairsWritten: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tests/{token}:
    get:
      operationId: getPublicTestByToken
      tags: [Assessments]
      summary: Résoudre un test partagé sans exposer ses réponses correctes
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Test public candidat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAssessment' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # ASSESSMENTS
  # ═══════════════════════════════════════════════════════════════

  /assessments:
    get:
      operationId: getAssessments
      tags: [Assessments]
      summary: Lister les évaluations disponibles (recruteur)
      responses:
        '200':
          description: Liste des évaluations (vue résumée)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssessmentSummary' }
    post:
      operationId: postAssessments
      tags: [Assessments]
      summary: Créer une évaluation manuellement (recruteur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentCreate' }
      responses:
        '201':
          description: Évaluation créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assessments/mine:
    get:
      operationId: getAssessmentsMine
      tags: [Assessments]
      summary: Lister mes évaluations (recruteur)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page d'évaluations du recruteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentPage' }

  /assessments/generate/from-prompt:
    post:
      operationId: postAssessmentsGenerateFromPrompt
      tags: [Assessments]
      summary: Générer un test par IA à partir d'une description libre (recruteur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobDescription, questionCount]
              properties:
                jobDescription: { type: string, maxLength: 1000 }
                questionCount: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '201':
          description: Évaluation générée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Service de génération IA indisponible }

  /assessments/generate/from-file:
    post:
      operationId: postAssessmentsGenerateFromFile
      tags: [Assessments]
      summary: Générer un test par IA à partir d'un fichier source uploadé (recruteur)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, questionCount]
              properties:
                file: { type: string, format: binary }
                questionCount: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '201':
          description: Évaluation générée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Fichier trop volumineux }
        '502': { description: Service de génération IA indisponible }

  /assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/AssessmentIdParam'
    get:
      operationId: getAssessmentsByAssessmentid
      tags: [Assessments]
      summary: Détail d'une évaluation avec ses questions (recruteur)
      responses:
        '200':
          description: Évaluation complète
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putAssessmentsByAssessmentid
      tags: [Assessments]
      summary: Mettre à jour une évaluation (recruteur propriétaire)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentCreate' }
      responses:
        '200':
          description: Évaluation mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAssessmentsByAssessmentid
      tags: [Assessments]
      summary: Supprimer une évaluation (recruteur propriétaire)
      responses:
        '204': { description: Évaluation supprimée }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # HARD SKILL TEST RESULTS (contrat squad web §7 — remplace
  # AssessmentAttempt/IntegrityStatus ; plus d'anti-fraude par callback,
  # mélange questions/options par tentative à la place)
  # ═══════════════════════════════════════════════════════════════

  /job-offers/{jobOfferId}/test-attempts:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    post:
      operationId: postJobOffersByJofferidTestAttempts
      tags: [TestAttempts]
      summary: Démarrer la (seule) tentative pour cette offre (candidat)
      description: >
        Questions et options mélangées par tentative — `presentedQuestions`
        (mapping de mélange) n'est jamais exposé. `correctOptionIndex` absent.
      responses:
        '201':
          description: Tentative démarrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestAttemptStarted' }
        '404':
          description: NO_ASSESSMENT_LINKED — l'offre n'a pas d'évaluation liée
        '409':
          description: ATTEMPT_ALREADY_CONSUMED — un résultat existe déjà pour ce candidat/cette offre

  /test-attempts/{attemptId}/submit:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postTestAttemptsByAttemptidSubmit
      tags: [TestAttempts]
      summary: Soumettre les réponses ; déclenche la notation (candidat, propriétaire)
      description: >
        `selectedOptionIndex` se réfère à l'ordre mélangé retourné au
        démarrage ; démélangé côté serveur via le mapping stocké. Si la
        soumission arrive après `expiresAt`, `status` devient `TIMEOUT` quoi
        qu'il arrive. Ni `answers` ni le détail de correction ne sont
        retournés ici (un test peut être réutilisé sur d'autres offres).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestAttemptSubmit' }
      responses:
        '200':
          description: Résultat noté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ATTEMPT_ALREADY_SUBMITTED

  /test-attempts/{attemptId}/abandon:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postTestAttemptsByAttemptidAbandon
      tags: [TestAttempts]
      summary: Abandon explicite (app fermée, retour arrière) (candidat, propriétaire)
      responses:
        '200':
          description: Résultat ABANDONED (score 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tentative déjà résolue

  /job-offers/{jobOfferId}/test-results/me:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJofferidTestResultsMe
      tags: [TestResults]
      summary: Mon résultat pour cette offre (candidat) — gating "déjà complété"
      responses:
        '200':
          description: Résultat existant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        '404': { description: Le candidat n'a pas encore tenté le test }

  /job-offers/{jobOfferId}/test-results:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJofferidTestResults
      tags: [TestResults]
      summary: Résultats paginés pour cette offre, joints aux données candidat (recruteur, propriétaire)
      parameters:
        - { name: sort, in: query, description: "Tri au format champ,direction (ex. completedAt,desc)", schema: { type: string } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page de résultats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResultPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-offers/{jobOfferId}/test-results/summary:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
    get:
      operationId: getJobOffersByJofferidTestResultsSummary
      tags: [TestResults]
      summary: Métriques agrégées sur l'ensemble complet des résultats (recruteur, propriétaire)
      description: >
        Calculé côté serveur sur le jeu de résultats complet (pas seulement
        la page courante) : `status != ABANDONED && passed`.
      responses:
        '200':
          description: Agrégat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResultsSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-offers/{jobOfferId}/test-results/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/JobOfferIdParam'
      - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJobOffersByJofferidTestResultsByCandidateid
      tags: [TestResults]
      summary: Détail avec correction par question (recruteur, propriétaire)
      responses:
        '200':
          description: Détail complet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResultDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # CANDIDATE RESUME
  # ═══════════════════════════════════════════════════════════════

  /candidates/{candidateId}/resume:
    parameters:
      - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCandidatesByCandidateidResume
      tags: [CandidateResume]
      summary: Résumé IA du candidat pour une offre — soft skills + hard skills (recruteur)
      parameters:
        - { name: jobOfferId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Résumé IA bilingue (soft skills candidat-level, hard skills par offre)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateResume' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # JOB OPPORTUNITY OFFERS
  # ═══════════════════════════════════════════════════════════════

  /job-opportunity-offers:
    post:
      operationId: postJobOpportunityOffers
      tags: [JobOpportunityOffers]
      summary: Recruter un candidat — envoyer une offre d'opportunité (recruteur)
      description: >
        Publie `JobOpportunityOfferSentEvent`. Engagement délivre la carte dans le chat.
        Le candidat doit confirmer via OTP SMS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId, jobOfferId]
              properties:
                candidateId: { type: string, format: uuid }
                jobOfferId: { type: string, format: uuid }
      responses:
        '201':
          description: Offre d'opportunité envoyée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpportunityOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /job-opportunity-offers/{offerId}:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJobOpportunityOffersByOfferid
      tags: [JobOpportunityOffers]
      summary: Obtenir les données de la carte offre (candidat)
      responses:
        '200':
          description: Carte d'offre d'opportunité
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpportunityOffer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /job-opportunity-offers/{offerId}/confirm:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postJobOpportunityOffersByOfferidConfirm
      tags: [JobOpportunityOffers]
      summary: Confirmer l'offre d'opportunité — déclenche l'envoi de l'OTP SMS (candidat)
      responses:
        '200':
          description: OTP SMS envoyé, en attente de vérification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpportunityOffer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /job-opportunity-offers/{offerId}/verify-otp:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postJobOpportunityOffersByOfferidVerifyOtp
      tags: [JobOpportunityOffers]
      summary: Soumettre le code OTP pour finaliser la confirmation (candidat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, minLength: 6, maxLength: 6, example: "745568" }
      responses:
        '200':
          description: Offre confirmée — otpVerified = true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpportunityOffer' }
        '400':
          description: Code OTP invalide ou expiré
        '404': { $ref: '#/components/responses/NotFound' }

  /job-opportunity-offers/{offerId}/reject:
    parameters:
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postJobOpportunityOffersByOfferidReject
      tags: [JobOpportunityOffers]
      summary: Rejeter l'offre d'opportunité (candidat)
      responses:
        '200':
          description: Offre rejetée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpportunityOffer' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # IDENTITY VERIFICATIONS
  # ═══════════════════════════════════════════════════════════════

  /identity-verifications:
    post:
      operationId: postIdentityVerifications
      tags: [IdentityVerifications]
      summary: Demander une vérification anti-fraude pour un candidat (recruteur)
      description: >
        Publie `IdentityVerificationRequestedEvent`. Le service tiers gère la reconnaissance
        faciale et poste le résultat via `POST /callbacks/identity-verification`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId: { type: string, format: uuid }
                jobOfferId:
                  type: string
                  format: uuid
                  description: Contexte optionnel — quelle offre a motivé la vérification
      responses:
        '201':
          description: Demande de vérification créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerification' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /identity-verifications/{verificationId}:
    parameters:
      - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIdentityVerificationsByVerificationid
      tags: [IdentityVerifications]
      summary: Consulter le statut d'une vérification (recruteur ou candidat concerné)
      responses:
        '200':
          description: Statut de la vérification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerification' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════════════════════════════════════════════
  # PAYMENTS
  # ═══════════════════════════════════════════════════════════════

  /payments:
    post:
      operationId: postPayments
      tags: [Payments]
      summary: Initier le paiement d'une session visioconférence (recruteur)
      description: >
        Frais : 9,99 EUR + taxe. Après confirmation OTP, publie
        `VideoConferencePaymentConfirmedEvent` et Engagement débloque l'appel vidéo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, cardLast4, cardType]
              properties:
                matchId: { type: string, format: uuid }
                cardLast4: { type: string, minLength: 4, maxLength: 4 }
                cardType: { type: string, example: CREDIT_CARD }
      responses:
        '201':
          description: Paiement initié — OTP SMS envoyé pour confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoConferencePayment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{paymentId}:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPaymentsByPaymentid
      tags: [Payments]
      summary: Statut et récapitulatif de commande d'un paiement
      responses:
        '200':
          description: Détail du paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoConferencePayment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{paymentId}/verify-otp:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postPaymentsByPaymentidVerifyOtp
      tags: [Payments]
      summary: Confirmer le paiement via OTP SMS (recruteur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, minLength: 6, maxLength: 6, example: "745568" }
      responses:
        '200':
          description: Paiement confirmé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoConferencePayment' }
        '400':
          description: Code OTP invalide ou expiré
        '403': { $ref: '#/components/responses/Forbidden' }

  # ═══════════════════════════════════════════════════════════════
  # CALLBACKS TIERS
  # ═══════════════════════════════════════════════════════════════

  /callbacks/identity-verification:
    post:
      operationId: postCallbacksIdentityVerification
      tags: [Callbacks]
      summary: Résultat de la reconnaissance faciale (tiers anti-fraude)
      security:
        - callbackSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityVerificationCallback' }
      responses:
        '200': { description: Callback traité }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /callbacks/fit-score:
    post:
      operationId: postCallbacksFitScore
      tags: [Callbacks]
      summary: Score de compatibilité calculé par l'IA externe (modèle asynchrone)
      security:
        - callbackSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FitScoreCallback' }
      responses:
        '200': { description: Callback traité }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ═══════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    callbackSecret:
      type: apiKey
      in: header
      name: X-Callback-Secret

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    JobOfferIdParam:
      name: jobOfferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentIdParam:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnprocessableEntity:
      description: État invalide pour cette opération
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:

    # ── Enums ──────────────────────────────────────────────────

    ContractType:
      type: string
      enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, APPRENTICESHIP, VOLUNTEER]

    WorkplaceType:
      type: string
      enum: [ON_SITE, REMOTE, HYBRID]

    ExperienceLevel:
      type: string
      enum: [JUNIOR, MID, SENIOR, EXECUTIVE]

    JobProfileType:
      type: string
      description: Profil dominant du métier (Couche A de la matrice de pondération Fit Score, inspiré RIASEC)
      enum: [TECHNIQUE, ANALYTIQUE, RELATIONNEL, MANAGERIAL, CONVENTIONNEL, ARTISTIQUE]

    JobPositionStatus:
      type: string
      enum: [APPROVED, PENDING_APPROVAL, REJECTED]

    JobPosition:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Développeur" }
        sector: { type: string, nullable: true, description: "null = métier transverse", example: "IT, AI & Fintech" }
        profileType: { $ref: '#/components/schemas/JobProfileType' }
        calibrated: { type: boolean, description: "false = pondération v1 non validée en atelier RH" }
        status: { $ref: '#/components/schemas/JobPositionStatus' }
        levelLabels:
          type: object
          description: Libellé affiché par niveau (défauts Junior/Mid/Senior/Executive sauf métiers avec intitulé usuel)
          additionalProperties: { type: string }
          example: { JUNIOR: "Apprenti / Ouvrier débutant", MID: "Compagnon confirmé", SENIOR: "Chef d'équipe", EXECUTIVE: "Chef de chantier" }
        createdAt: { type: string, format: date-time }
        suggestedProfileType:
          allOf: [{ $ref: '#/components/schemas/JobProfileType' }]
          nullable: true
          description: Suggestion IA à la soumission (similarité sémantique) — l'admin choisit librement le profil final à l'approbation

    TypeEvaluationHard:
      type: string
      description: Mode de mesure du hard skills du profil — QCM sauf ARTISTIQUE (Portfolio par défaut)
      enum: [QCM, PORTFOLIO, MIXTE]

    JobRoleProfile:
      type: object
      description: Pondération de référence pour un couple (profil métier, niveau) — jamais par métier individuel (CdC Fit Score v3 §4.3)
      properties:
        profileType: { $ref: '#/components/schemas/JobProfileType' }
        level: { $ref: '#/components/schemas/ExperienceLevel' }
        softWeight: { type: integer, minimum: 0, maximum: 100 }
        hardWeight: { type: integer, minimum: 0, maximum: 100 }
        expectedHardWeight: { type: integer, minimum: 0, maximum: 100, description: "Informationnel uniquement — jamais utilisé dans le calcul du score" }
        cognitiveFlexibilityWeight: { type: integer, minimum: 0, maximum: 100 }
        workingMemoryWeight: { type: integer, minimum: 0, maximum: 100 }
        decisionMakingWeight: { type: integer, minimum: 0, maximum: 100 }
        executivePlanningWeight: { type: integer, minimum: 0, maximum: 100 }
        emotionalRegulationWeight: { type: integer, minimum: 0, maximum: 100 }
        typeEvaluationHard: { $ref: '#/components/schemas/TypeEvaluationHard' }
        calibrated: { type: boolean, description: "false = pondération v1 non validée en atelier RH" }

    JobOfferStatus:
      type: string
      description: Librement réversible dans n'importe quelle direction, aucun état terminal.
      enum: [DRAFT, ACTIVE, CLOSED]

    SwipeDirection:
      type: string
      enum: [RIGHT, LEFT]

    SwipeSide:
      type: string
      description: Qui a effectué le swipe.
      enum: [CANDIDATE, RECRUITER]

    AssessmentGenerationMode:
      type: string
      enum: [FROM_FILE, FROM_PROMPT]

    AssessmentGenerationStatusEnum:
      type: string
      enum: [PENDING, COMPLETED, FAILED]

    JobOpportunityStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED]

    IdentityVerificationStatus:
      type: string
      enum: [PENDING, COMPLETED_SUCCESS, COMPLETED_FAILURE]

    PaymentStatus:
      type: string
      enum: [PENDING, OTP_SENT, CONFIRMED, FAILED]

    # ── Value Objects ──────────────────────────────────────────

    SalaryRange:
      type: object
      properties:
        min: { type: number, format: double, example: 12000 }
        max: { type: number, format: double, example: 22000 }
        currency: { type: string, example: EUR }

    Location:
      type: object
      properties:
        city: { type: string, example: "Paris" }
        country: { type: string, example: "France" }
        remote: { type: boolean }

    Money:
      type: object
      properties:
        amount: { type: number, format: double, example: 9.99 }
        currency: { type: string, example: EUR }

    PaymentMethodInput:
      type: object
      required: [cardNumber, expiryMonth, expiryYear, cvv, cardholderName]
      properties:
        cardNumber: { type: string, example: "4966000000000000" }
        expiryMonth: { type: integer, example: 12 }
        expiryYear: { type: integer, example: 2027 }
        cvv: { type: string, example: "123" }
        cardholderName: { type: string, example: "Kristin Watson" }

    PaymentMethodSummary:
      type: object
      properties:
        type: { type: string, enum: [CREDIT_CARD, DEBIT_CARD] }
        last4: { type: string, example: "8553" }
        expiryMonth: { type: integer }
        expiryYear: { type: integer }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    ApiError:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    # ── JobOffer ───────────────────────────────────────────────

    JobOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        recruiterId: { type: string, format: uuid }
        recruiter: { $ref: '#/components/schemas/RecruiterSummary' }
        hiringContactId: { type: string, format: uuid, nullable: true }
        title: { type: string, example: "UX/UI Designer" }
        city: { type: string, example: "Tunis" }
        country: { type: string, example: "TN" }
        salaryMin: { type: number, format: double, example: 40000 }
        salaryMax: { type: number, format: double, example: 70000, description: "Doit être >= salaryMin" }
        contractType: { $ref: '#/components/schemas/ContractType' }
        workplaceType: { $ref: '#/components/schemas/WorkplaceType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        description: { type: string }
        responsibilities: { type: string }
        minimumQualifications: { type: string }
        preferredQualifications: { type: string }
        whatWeOffer: { type: string }
        howToApply: { type: string }
        assessmentId: { type: string, format: uuid, nullable: true }
        jobPositionId: { type: string, format: uuid, nullable: true }
        shareableLink: { type: string, format: uri, nullable: true }
        openToInternational: { type: boolean }
        status: { $ref: '#/components/schemas/JobOfferStatus' }
        applicantCount: { type: integer, minimum: 0 }
        successRate: { type: integer, description: "% de candidats ayant réussi toutes les évaluations" }
        fitScore: { type: integer, description: "Score de compatibilité du candidat connecté (0-100). Absent si non connecté." }
        goodFit: { type: boolean, nullable: true, description: "Vrai à partir du seuil provisoire de 70." }
        softSkillScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        cvMatchScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        hardSkillScore: { type: integer, minimum: 0, maximum: 100, nullable: true, description: "null tant qu'aucune tentative de QCM n'est complétée" }
        partialData: { type: boolean, nullable: true, description: "Couverture des jeux psychométriques sous le seuil (CdC Fit Score v3 §3.3)" }
        hardSkillsAlert: { $ref: '#/components/schemas/HardSkillsAlertLevel' }
        postedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HardSkillsAlertLevel:
      type: string
      description: >
        Alerte "hard skills manquant" (CdC Fit Score v3 §6) quand aucun QCM
        n'est attaché à l'offre — purement informationnel, jamais utilisé
        dans le calcul du Fit Score. ARTISTIQUE reste toujours à INFO
        (évaluation par portfolio, fonctionnement normal, pas une anomalie).
      enum: [NONE, INFO, MODERATE, STRONG]

    RecruiterSummary:
      type: object
      description: >
        Recruteur propriétaire de l'offre, joint à la lecture depuis la
        projection Identity — jamais dupliqué sur l'offre elle-même.
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string, example: "Acme Corp", nullable: true }
        companyInfo: { type: string, nullable: true, example: "Acme builds tools for distributed teams..." }

    JobOfferCreate:
      type: object
      required: [title, description, contractType, workplaceType, experienceLevel, city, country,
                 salaryMin, salaryMax, responsibilities, minimumQualifications, openToInternational]
      properties:
        title: { type: string, minLength: 3 }
        city: { type: string }
        country: { type: string }
        salaryMin: { type: number, format: double }
        salaryMax: { type: number, format: double, description: "Doit être >= salaryMin" }
        contractType: { $ref: '#/components/schemas/ContractType' }
        workplaceType: { $ref: '#/components/schemas/WorkplaceType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        description: { type: string, minLength: 20 }
        responsibilities: { type: string }
        minimumQualifications: { type: string }
        preferredQualifications: { type: string }
        whatWeOffer: { type: string }
        howToApply: { type: string }
        jobPositionId: { type: string, format: uuid, nullable: true }
        openToInternational: { type: boolean, default: false }

    JobOfferUpdate:
      type: object
      description: >
        PATCH — seuls `status` et/ou `assessmentId` sont modifiables ici (tout
        autre champ passe par PUT, même forme que la création).
        `assessmentId: null` explicite désassigne l'évaluation ; l'omettre la
        laisse inchangée.
      properties:
        assessmentId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/JobOfferStatus' }

    JobOfferSummary:
      type: object
      description: >
        Vue résumée pour les listes (contrat squad web, §3.4) — pas de champs
        texte longs. `jobPositionId`/le fit score et `applicantCount` restent
        présents : le deck de swipe candidat et le référentiel de métiers en
        dépendent déjà.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyName: { type: string, nullable: true, example: "Acme Corp" }
        city: { type: string }
        country: { type: string }
        salaryMin: { type: number, format: double }
        salaryMax: { type: number, format: double }
        contractType: { $ref: '#/components/schemas/ContractType' }
        workplaceType: { $ref: '#/components/schemas/WorkplaceType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        status: { $ref: '#/components/schemas/JobOfferStatus' }
        postedAt: { type: string, format: date-time }
        jobPositionId: { type: string, format: uuid, nullable: true }
        applicantCount: { type: integer, minimum: 0 }
        fitScore: { type: integer, nullable: true }
        goodFit: { type: boolean, nullable: true }
        softSkillScore: { type: integer, nullable: true }
        cvMatchScore: { type: integer, nullable: true }
        hardSkillScore: { type: integer, nullable: true }
        partialData: { type: boolean, nullable: true }
        hardSkillsAlert: { $ref: '#/components/schemas/HardSkillsAlertLevel' }

    JobOfferSummaryPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/JobOfferSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── Swipe ──────────────────────────────────────────────────

    SwipeCreate:
      type: object
      required: [direction]
      description: >
        jobOfferId/candidateId/side viennent du chemin et du JWT, jamais du
        corps (contrat squad web §5.5 — swiperId retiré du contrat).
      properties:
        direction: { $ref: '#/components/schemas/SwipeDirection' }

    CandidateMatchPreview:
      type: object
      description: Lu à la volée pour le popup "It's a match!" — jamais persisté sur Swipe.
      properties:
        id: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        jobTitle: { type: string }
        companyName: { type: string }

    CandidateSwipeResult:
      type: object
      properties:
        swipeId: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/SwipeDirection' }
        matched: { type: boolean }
        match:
          allOf: [{ $ref: '#/components/schemas/CandidateMatchPreview' }]
          nullable: true
          description: "null si matched = false"

    RecruiterMatchPreview:
      type: object
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        candidateFullName: { type: string }
        candidateAvatarUrl: { type: string }

    RecruiterSwipeResult:
      type: object
      properties:
        swipeId: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/SwipeDirection' }
        matched: { type: boolean }
        match:
          allOf: [{ $ref: '#/components/schemas/RecruiterMatchPreview' }]
          nullable: true
          description: "null si matched = false"

    MatchingDeckOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyName: { type: string }
        city: { type: string }
        country: { type: string }
        contractType: { $ref: '#/components/schemas/ContractType' }
        workplaceType: { $ref: '#/components/schemas/WorkplaceType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        recruiterAlreadyInterested:
          type: boolean
          description: Indicateur d'affichage uniquement (déjà positionné en priorité 1 côté serveur).

    MatchingDeckOfferPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/MatchingDeckOffer' }
        page: { $ref: '#/components/schemas/PageMeta' }

    MatchingDeckCandidate:
      type: object
      description: >
        fullName/avatarUrl/headline sont des placeholders en attente du
        contrat Candidate/Profile (§9/§11) — la forme du DTO est finale.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        avatarUrl: { type: string }
        headline: { type: string, nullable: true }
        candidateAlreadyInterested: { type: boolean }

    MatchingDeckCandidatePage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/MatchingDeckCandidate' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── Match ──────────────────────────────────────────────────

    MatchedJobOfferSummary:
      type: object
      description: Lu à la volée depuis l'offre — jamais persisté sur Match (pas de données dupliquées).
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyName: { type: string }

    CandidateMatchListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobOffer: { $ref: '#/components/schemas/MatchedJobOfferSummary' }
        matchedAt: { type: string, format: date-time }

    CandidateMatchPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/CandidateMatchListItem' }
        page: { $ref: '#/components/schemas/PageMeta' }

    MatchedCandidateSummary:
      type: object
      description: Lu à la volée depuis la projection acteur — jamais persisté sur Match.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        avatarUrl: { type: string }

    RecruiterMatchListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        candidate: { $ref: '#/components/schemas/MatchedCandidateSummary' }
        matchedAt: { type: string, format: date-time }

    RecruiterMatchPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RecruiterMatchListItem' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── FitScore ───────────────────────────────────────────────

    FitScore:
      type: object
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        score: { type: integer, minimum: 0, maximum: 100, example: 88 }
        goodFit: { type: boolean, description: "Vrai à partir du seuil provisoire de 70." }
        softSkillScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        cvMatchScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        hardSkillScore: { type: integer, minimum: 0, maximum: 100, nullable: true, description: "null tant qu'aucune tentative de QCM n'est complétée" }
        partialData: { type: boolean, description: "Couverture des jeux psychométriques sous le seuil (CdC Fit Score v3 §3.3) — badge « données partielles »" }
        computedAt: { type: string, format: date-time }

    # ── Candidate Feed ─────────────────────────────────────────

    CandidateFeedItem:
      type: object
      description: Profil candidat tel qu'affiché dans le fil recruteur (données lues depuis Identity)
      properties:
        candidateId: { type: string, format: uuid }
        fullName: { type: string }
        targetRole: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        fitScore: { type: integer, minimum: 0, maximum: 100 }
        goodFit: { type: boolean }
        softSkillsScore: { type: integer, minimum: 0, maximum: 100 }
        hardSkillScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        partialData: { type: boolean }
        contractPreferences:
          type: array
          items: { type: string }
        availability: { type: string, example: "Immédiatement" }
        international: { type: boolean }

    CandidateFeedPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/CandidateFeedItem' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── Assessment ─────────────────────────────────────────────

    AssessmentQuestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        text: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
          example: ["Docker", "Git", "Jenkins", "Node.js"]
        correctOptionIndex: { type: integer, minimum: 0, maximum: 3 }

    AssessmentQuestionInput:
      type: object
      required: [text, options, correctOptionIndex]
      properties:
        text: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        correctOptionIndex: { type: integer, minimum: 0, maximum: 3 }

    Assessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdByRecruiterId: { type: string, format: uuid }
        title: { type: string, example: "Test compétences — Développeur React" }
        timeLimitSeconds: { type: integer, example: 1200 }
        maxQuestions: { type: integer, example: 30 }
        generationSource: { $ref: '#/components/schemas/AssessmentGenerationMode' }
        shareableLink: { type: string, format: uri }
        questions:
          type: array
          items: { $ref: '#/components/schemas/AssessmentQuestion' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        linkedJobOfferIds:
          type: array
          items: { type: string, format: uuid }
          description: Offres référençant encore cette évaluation.

    AssessmentSummary:
      type: object
      description: Vue résumée d'une évaluation (liste recruteur — sans les questions)
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        timeLimitSeconds: { type: integer }
        maxQuestions: { type: integer }
        questionsCount: { type: integer }
        createdAt: { type: string, format: date-time }
        linkedJobOffersCount: { type: integer }

    PublicAssessmentQuestion:
      type: object
      required: [id, order, text, options]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        text: { type: string }
        options:
          type: array
          items: { type: string }

    PublicAssessment:
      type: object
      required: [id, title, questionCount, timeLimitSeconds, questions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        questionCount: { type: integer }
        timeLimitSeconds: { type: integer }
        questions:
          type: array
          items: { $ref: '#/components/schemas/PublicAssessmentQuestion' }

    AssessmentCreate:
      type: object
      required: [title, questions]
      properties:
        title: { type: string, minLength: 3 }
        timeLimitSeconds: { type: integer, minimum: 1 }
        questions:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/AssessmentQuestionInput' }

    AssessmentPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Assessment' }
        page: { $ref: '#/components/schemas/PageMeta' }

    AssessmentGenerationRequest:
      type: object
      required: [mode, numberOfQuestions]
      properties:
        mode: { $ref: '#/components/schemas/AssessmentGenerationMode' }
        numberOfQuestions: { type: integer, minimum: 1, maximum: 30 }
        file:
          type: string
          format: binary
          description: "Requis si mode = FROM_FILE. Fichier PDF ou MCQ."
        promptText:
          type: string
          maxLength: 1000
          description: "Requis si mode = FROM_PROMPT. Description du poste et du domaine."

    AssessmentGenerationStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/AssessmentGenerationMode' }
        status: { $ref: '#/components/schemas/AssessmentGenerationStatusEnum' }
        numberOfQuestions: { type: integer }
        resultingAssessmentId:
          type: string
          format: uuid
          description: "Présent quand status = COMPLETED"
        requestedAt: { type: string, format: date-time }

    # ── Hard Skill Test Results (contrat squad web §7) ─────────
    # TestAttempt est une ressource technique/interne : presentedQuestions
    # (mapping de mélange) n'apparaît dans aucun schéma de réponse.

    TestAttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, EXPIRED]

    TestResultStatus:
      type: string
      enum: [COMPLETED, TIMEOUT, ABANDONED]

    PresentedQuestion:
      type: object
      description: Question mélangée présentée au candidat — pas de correctOptionIndex.
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        text: { type: string }
        options:
          type: array
          items: { type: string }

    TestAttemptStarted:
      type: object
      properties:
        attemptId: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        timeLimitSeconds: { type: integer }
        expiresAt: { type: string, format: date-time }
        questions:
          type: array
          items: { $ref: '#/components/schemas/PresentedQuestion' }

    TestAttemptAnswerInput:
      type: object
      required: [questionId, selectedOptionIndex]
      properties:
        questionId: { type: string, format: uuid }
        selectedOptionIndex:
          type: integer
          minimum: 0
          description: Index dans l'ordre mélangé retourné au démarrage, pas l'ordre original.

    TestAttemptSubmit:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: '#/components/schemas/TestAttemptAnswerInput' }

    TestResult:
      type: object
      description: >
        Vue candidat — ni answers ni détail de correction (un test peut être
        réutilisé sur d'autres offres).
      properties:
        id: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        hardSkillTestId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        score: { type: integer, minimum: 0 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean, description: "percentage >= 70 (seuil fixe global)" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        duration: { type: integer, description: "completedAt - startedAt, en secondes" }
        status: { $ref: '#/components/schemas/TestResultStatus' }

    TestResultListItem:
      type: object
      description: Vue recruteur (liste) — jointe aux données candidat.
      properties:
        id: { type: string, format: uuid }
        candidate: { $ref: '#/components/schemas/MatchedCandidateSummary' }
        score: { type: integer, minimum: 0 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        duration: { type: integer }
        status: { $ref: '#/components/schemas/TestResultStatus' }
        completedAt: { type: string, format: date-time }

    TestResultPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TestResultListItem' }
        page: { $ref: '#/components/schemas/PageMeta' }

    TestResultsSummary:
      type: object
      description: Calculé sur l'ensemble complet des résultats, pas seulement la page courante.
      properties:
        candidateCount: { type: integer, minimum: 0 }
        passedCount: { type: integer, minimum: 0 }
        successRate: { type: integer, minimum: 0, maximum: 100 }

    TestAnswerBreakdownItem:
      type: object
      properties:
        questionId: { type: string, format: uuid }
        questionText: { type: string }
        selectedAnswer: { type: string }
        correctAnswer: { type: string }
        isCorrect: { type: boolean }

    TestResultDetail:
      type: object
      description: Vue recruteur (détail) — correction par question, jamais exposée au candidat.
      properties:
        id: { type: string, format: uuid }
        candidate: { $ref: '#/components/schemas/MatchedCandidateSummary' }
        score: { type: integer, minimum: 0 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        duration: { type: integer }
        status: { $ref: '#/components/schemas/TestResultStatus' }
        answerBreakdown:
          type: array
          items: { $ref: '#/components/schemas/TestAnswerBreakdownItem' }

    # ── Candidate Resume ───────────────────────────────────────

    ResumeSection:
      type: object
      properties:
        available: { type: boolean, description: "false = repli statique, pas de génération IA encore disponible" }
        textFr: { type: string }
        textEn: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }

    CandidateResume:
      type: object
      properties:
        softSkills: { $ref: '#/components/schemas/ResumeSection' }
        hardSkills: { $ref: '#/components/schemas/ResumeSection' }


    # ── Job Opportunity Offer ──────────────────────────────────

    JobOpportunityOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        recruiterId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        title: { type: string, example: "Poste UX/UI Designer" }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        status: { $ref: '#/components/schemas/JobOpportunityStatus' }
        otpVerified: { type: boolean }
        sentAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }

    # ── Identity Verification ──────────────────────────────────

    IdentityVerification:
      type: object
      properties:
        id: { type: string, format: uuid }
        requestedByRecruiterId: { type: string, format: uuid }
        targetCandidateId: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/IdentityVerificationStatus' }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    # ── Payment ────────────────────────────────────────────────

    VideoConferencePayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        recruiterId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        matchId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethodSummary' }
        otpVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }

    # ── Recruiter Dashboard ────────────────────────────────────

    RecruiterDashboard:
      type: object
      properties:
        assessments:
          type: array
          items: { $ref: '#/components/schemas/AssessmentSummary' }
        jobOffers:
          type: array
          items: { $ref: '#/components/schemas/JobOffer' }

    # ── Callbacks ──────────────────────────────────────────────

    IdentityVerificationCallback:
      type: object
      required: [verificationId, result]
      properties:
        verificationId: { type: string, format: uuid }
        result:
          type: string
          enum: [COMPLETED_SUCCESS, COMPLETED_FAILURE]
        resolvedAt: { type: string, format: date-time }

    FitScoreCallback:
      type: object
      required: [candidateId, jobOfferId, score]
      properties:
        candidateId: { type: string, format: uuid }
        jobOfferId: { type: string, format: uuid }
        score: { type: integer, minimum: 0, maximum: 100 }
        computedAt: { type: string, format: date-time }
